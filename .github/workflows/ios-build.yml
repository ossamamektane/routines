name: iOS Build (free, local)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
      ASC_APP_ID: "6829007704"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Install any missing packages
        run: |
          cat > /tmp/find-missing.js <<'EOF'
          const fs = require("fs"), path = require("path");
          const builtins = new Set(require("module").builtinModules);
          const found = new Set(["react", "react-native"]);
          if (fs.existsSync("app.json")) {
            const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
            for (const p of ((cfg.expo || cfg).plugins || [])) {
              const n = Array.isArray(p) ? p[0] : p;
              if (typeof n === "string") found.add(n);
            }
          }
          function walk(d) {
            for (const e of fs.readdirSync(d, { withFileTypes: true })) {
              if (["node_modules", ".git", "ios", "android", ".expo"].includes(e.name)) continue;
              const p = path.join(d, e.name);
              if (e.isDirectory()) walk(p);
              else if (/\.(js|jsx|ts|tsx|mjs|cjs)$/.test(e.name)) {
                const s = fs.readFileSync(p, "utf8");
                const re = /(?:import\s+(?:[^'"]*?\s+from\s+)?|require\s*\(\s*|import\s*\(\s*|export\s+[^'"]*?\s+from\s+)["']([^"']+)["']/g;
                let m; while ((m = re.exec(s))) found.add(m[1]);
              }
            }
          }
          walk(process.cwd());
          const pkgs = [...found]
            .filter(n => !n.startsWith(".") && !n.startsWith("/") && !n.startsWith("@/") && !n.startsWith("~") && !n.startsWith("node:"))
            .map(n => n.startsWith("@") ? n.split("/").slice(0, 2).join("/") : n.split("/")[0])
            .filter(n => !builtins.has(n) && /^(@[a-z0-9._-]+\/)?[a-z0-9._-]+$/.test(n));
          const missing = [...new Set(pkgs)].filter(n => {
            try { require.resolve(n + "/package.json", { paths: [process.cwd()] }); return false; }
            catch { return true; }
          });
          console.log(missing.join(" "));
          EOF
          MISSING=$(node /tmp/find-missing.js)
          echo "Missing packages: $MISSING"
          if [ -n "$MISSING" ]; then npx expo install $MISSING; fi

      - name: Fix Expo package versions
        run: npx expo install --fix

      - name: Link Expo project
        run: eas init --id 5d022e8d-86fb-4b99-aa7b-c84bcd18d902 --non-interactive --force

      - name: Check Expo config
        run: npx expo config --json

      - name: Build iOS locally on runner
        run: eas build --platform ios --profile production --local --non-interactive --output ${{ github.workspace }}/build.ipa

      - name: Save .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build.ipa

      - name: Add App Store app ID to eas.json
        run: |
          node -e '
          const fs = require("fs");
          const f = "eas.json";
          const cfg = fs.existsSync(f) ? JSON.parse(fs.readFileSync(f, "utf8")) : {};
          cfg.submit = cfg.submit || {};
          cfg.submit.production = cfg.submit.production || {};
          cfg.submit.production.ios = cfg.submit.production.ios || {};
          cfg.submit.production.ios.ascAppId = process.env.ASC_APP_ID;
          fs.writeFileSync(f, JSON.stringify(cfg, null, 2));
          '

      - name: Submit to App Store Connect
        run: eas submit --platform ios --profile production --path ${{ github.workspace }}/build.ipa --non-interactive
