name: iOS Build (free, local)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Install missing Expo plugins
        run: |
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("app.json")) { fs.writeFileSync("missing.txt", ""); process.exit(0); }
          const cfg = JSON.parse(fs.readFileSync("app.json", "utf8"));
          const plugins = (cfg.expo || cfg).plugins || [];
          const names = plugins
            .map(p => Array.isArray(p) ? p[0] : p)
            .filter(n => typeof n === "string" && !n.startsWith("."))
            .map(n => n.startsWith("@") ? n.split("/").slice(0, 2).join("/") : n.split("/")[0]);
          const missing = [...new Set(names)].filter(n => {
            try { require.resolve(n + "/package.json", { paths: [process.cwd()] }); return false; }
            catch { return true; }
          });
          fs.writeFileSync("missing.txt", missing.join(" "));
          '
          MISSING=$(cat missing.txt)
          rm -f missing.txt
          echo "Missing plugins: $MISSING"
          if [ -n "$MISSING" ]; then npx expo install $MISSING; fi

      - name: Fix Expo package versions
        run: npx expo install --fix

      - name: Link Expo project
        run: eas init --id 5d022e8d-86fb-4b99-aa7b-c84bcd18d902 --non-interactive --force

      - name: Check Expo config
        run: npx expo config --json

      - name: Build iOS locally on runner
        run: eas build --platform ios --profile production --local --non-interactive --output ${{ github.workspace }}/build.ipa

      - name: Save .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build.ipa

      - name: Submit to App Store Connect
        run: eas submit --platform ios --path ${{ github.workspace }}/build.ipa --non-interactive
