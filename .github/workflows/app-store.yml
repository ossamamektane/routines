# One-click build: GitHub repo → Actions → "Send to App Store" → Run workflow.
2
# It builds the iPhone app on GitHub's own Mac (free — no Expo build credits used)
3
# and uploads it to TestFlight / App Store Connect.
4
# To update the app's screen: replace web/index.html (same file as the website), then run this again.
5
name: Send to App Store
6
​
7
on:
8
  workflow_dispatch:
9
​
10
jobs:
11
  ios:
12
    runs-on: macos-latest
13
    timeout-minutes: 90
14
    env:
15
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
16
      # Lets EAS create the signing certificate + provisioning profile for you (no prompts).
17
      EXPO_ASC_API_KEY_PATH: /tmp/asc_key.p8
18
      EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
19
      EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
20
      EXPO_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
21
      EXPO_APPLE_TEAM_TYPE: ${{ secrets.APPLE_TEAM_TYPE || 'INDIVIDUAL' }}
22
      # Upload the folder exactly as it is after "Install everything" (with the full
23
      # package list), instead of the bare version saved on GitHub.
24
      EAS_NO_VCS: 1
25
      EAS_BUILD_NO_EXPO_GO_WARNING: true
26
    steps:
27
      - name: Get the code
28
        uses: actions/checkout@v4
29
​
30
      - name: Use the newest Xcode
31
        uses: maxim-lobanov/setup-xcode@v1
32
        with:
33
          xcode-version: latest-stable
34
​
35
      - name: Set up Node
36
        uses: actions/setup-node@v4
37
        with:
38
          node-version: 22
39
​
40
      - name: Set up Expo / EAS
41
        uses: expo/expo-github-action@v8
42
        with:
43
          eas-version: latest
44
          token: ${{ secrets.EXPO_TOKEN }}
45
​
46
      - name: Install everything
47
        run: |
48
          npm install
49
          npm run setup || echo "Skipped Expo's broken plugin step"
50
          npx expo install expo-font || echo "ok"
51
          npx expo install expo-system-ui || echo "ok"
52
          node -e "for (const m of ['react','react-native','react-native-webview','expo-notifications','expo-haptics','expo-localization','expo-document-picker','expo-sharing','expo-file-system','expo-splash-screen','expo-status-bar','expo-system-ui','react-native-safe-area-context']) { require.resolve(m + '/package.json'); console.log('ok', m); }"
53
​
54
      - name: Put the Routines page inside the app
55
        run: node scripts/make-web.js
56
​
57
      - name: Add the App Store Connect key
58
        run: |
59
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$EXPO_ASC_API_KEY_PATH"
60
          node -e '
61
            const fs = require("fs");
62
            const eas = JSON.parse(fs.readFileSync("eas.json", "utf8"));
63
            eas.submit.production = { ios: {
64
              ascAppId: process.env.ASC_APP_ID,
65
              ascApiKeyPath: process.env.EXPO_ASC_API_KEY_PATH,
66
              ascApiKeyId: process.env.EXPO_ASC_KEY_ID,
67
              ascApiKeyIssuerId: process.env.EXPO_ASC_ISSUER_ID
68
            }};
69
            fs.writeFileSync("eas.json", JSON.stringify(eas, null, 2));
70
          '
71
        env:
72
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
73
​
74
      - name: Keep the upload small
75
        run: printf 'node_modules/\n.expo/\nios/\nandroid/\n*.p8\n*.p12\n*.mobileprovision\n' > .easignore
76
​
77
      - name: Show the package list being built
78
        run: cat package.json
79
​
80
      - name: Link to your Expo account
81
        run: eas init --force --non-interactive
82
​
83
      - name: Build the iPhone app on GitHub's Mac (takes ~20–40 min)
84
        run: eas build --platform ios --profile production --local --non-interactive --output "$RUNNER_TEMP/Routines.ipa"
85
​
86
      - name: Upload to App Store Connect
87
        run: eas submit --platform ios --path "$RUNNER_TEMP/Routines.ipa" --profile production --non-interactive --wait
88
​
