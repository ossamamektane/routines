<!-- Original Routines icon: a repeat loop and checkmark represent completing recurring tasks.
     Keep this square and opaque: iOS applies its own rounded mask. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="blue" x1="0.12" y1="0" x2="0.82" y2="1"><stop stop-color="#399CFF"/><stop offset="0.52" stop-color="#0875EB"/><stop offset="1" stop-color="#0053CB"/></linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".70"/></linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#blue)"/>
  <path d="M 291 329 A 292 292 0 1 1 220 518" fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round"/>
  <path d="M 176 549 L 220 504 L 261 548" fill="none" stroke="#fff" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 351 511 L 461 619 L 684 382" fill="none" stroke="#fff" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
