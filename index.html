<script>
/* no zoom, no double-tap zoom, no pinch — same rules as a native app */
(function(){
  ["gesturestart","gesturechange","gestureend"].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener("touchmove", function(e){
    if((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) e.preventDefault();
  }, {passive:false});
  var lastTap = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if(now - lastTap <= 320 && !(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
    lastTap = now;
  }, {passive:false});
  /* no copy, no selection, no long-press menu (fields excepted) */
  function field(t){ return t && t.closest && t.closest("input,textarea,[contenteditable]"); }
  ["selectstart","contextmenu","dragstart","copy","cut"].forEach(function(ev){
    document.addEventListener(ev, function(e){ if(!field(e.target)) e.preventDefault(); }, {capture:true});
  });
  /* iOS can leave the page scaled or nudged sideways after typing — put it back */
  function unzoom(){
    var m = document.querySelector('meta[name="viewport"]');
    if(m){ var c = m.getAttribute("content"); m.setAttribute("content", c + " "); m.setAttribute("content", c); }
    if(window.pageXOffset) window.scrollTo(0, window.pageYOffset);
  }
  document.addEventListener("focusout", function(){ setTimeout(unzoom, 60); }, true);
  window.addEventListener("orientationchange", function(){ setTimeout(unzoom, 250); });
  document.addEventListener("scroll", function(){ if(window.pageXOffset) window.scrollTo(0, window.pageYOffset); }, {passive:true});
  if("scrollRestoration" in history) history.scrollRestoration = "manual";
})();
</script>

  --ysoft:rgba(255,204,0,.13); --red:#ff5c4d; --redsoft:rgba(255,51,51,.14);
  --menu:#262626; --pop:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
  --seg:#3a3a3a; --segsh:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{color:var(--ink);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;min-height:100svh}
input{font:inherit;font-size:16px;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
svg{display:block;flex:none}
.tab{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:var(--st) var(--sr) 0 var(--sl);transition:box-shadow .2s}
.hdr.sh{box-shadow:0 1px 0 var(--line)}
.hdr-in{max-width:680px;margin:0 auto;height:58px;padding:0 16px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:-.01em;margin-inline-end:auto}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--y);display:grid;place-items:center;color:#000}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;transition:background .15s}
.ib:hover{background:var(--bg3)} .ib:active{transform:scale(.96)}
.ib.pri{background:var(--y);color:#000;padding:0 14px 0 11px}.ib.pri:hover{background:var(--yh)}
.ib .lc{font-size:13px;font-weight:700;text-transform:uppercase}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;min-width:210px;max-width:calc(100vw - 24px);background:var(--menu);border-radius:14px;box-shadow:var(--pop);padding:6px;z-index:30;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .14s,transform .14s}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}
.mh{font-size:12px;color:var(--ink3);padding:6px 10px 4px}
.mi{width:100%;height:42px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:10px;font-size:15px}
.mi:hover{background:var(--bg2)} .mk{margin-inline-start:auto;opacity:0;display:flex} .mi.sel .mk{opacity:1}
.msep{height:1px;background:var(--line);margin:5px 6px}

/* page */
.wrap{max-width:680px;margin:0 auto;padding:6px calc(16px + var(--sr)) calc(48px + var(--sb)) calc(16px + var(--sl))}
.day{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 12px}
.day h1{font-size:28px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.02em}
.day p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.clock{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.meter{display:flex;gap:3px;height:6px;margin:0 0 16px}
.meter i{flex:1;border-radius:3px;background:var(--bg3);transition:background .3s}
.meter i.on{background:var(--y)} .meter i.late{background:var(--red)}

/* now card */
.now{background:var(--y);color:#000;border-radius:20px;padding:16px 16px 16px 18px;display:flex;align-items:center;gap:14px;margin:0 0 26px}
.now.calm{background:var(--bg2);color:var(--ink)}
.now-tx{flex:1;min-width:0}
.now-k{font-size:13px;font-weight:500;opacity:.66;display:flex;gap:6px;align-items:center}
.now-k b{background:#000;color:var(--y);font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
.now-n{font-size:22px;font-weight:700;line-height:1.15;margin:3px 0 2px;overflow-wrap:anywhere}
.now-r{font-size:14px;opacity:.75}
.bigck{width:60px;height:60px;border-radius:50%;background:#000;color:var(--y);display:grid;place-items:center;flex:none;transition:transform .15s}
.bigck:active{transform:scale(.92)}
.now.calm .bigck{background:var(--y);color:#000}

/* sections */
.sec{margin:0 0 24px}
.sh2{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.sh2 h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.sh2 span{color:var(--ink3);font-size:14px}
.sh2 em{font-style:normal;margin-inline-start:auto;color:var(--ink2);font-size:13px}
.sh2 em.red{color:var(--red)}
.box{background:var(--bg2);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;position:relative;transition:opacity .3s,background .2s}
.row+.row::before{content:"";position:absolute;top:0;inset-inline:56px 0;height:1px;background:var(--line)}
.tm{width:46px;flex:none;margin-inline-end:-2px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tm small{display:block;font-size:12px;font-weight:400;color:var(--ink3)}
.row.late .tm{color:var(--red)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .15s;color:#000}
.ck svg{opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.ck:active{transform:scale(.88)}
.row.late .ck{border-color:var(--red)}
.row.done .ck,.ck.on{background:var(--y);border-color:var(--y)}
.row.done .ck svg,.ck.on svg{opacity:1;transform:none}
.bd{flex:1;min-width:0;padding:4px 0}
.nm{font-size:16px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.sb{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.row.done .nm{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.row.done .sb{color:var(--ink3)}
.tag{flex:none;font-size:12px;font-weight:500;padding:4px 8px;border-radius:8px;background:var(--bg3);color:var(--ink2);white-space:nowrap}
.tag.tnow{background:var(--y);color:#000}.tag.late{background:var(--redsoft);color:var(--red)}
.dots{display:flex;gap:4px;flex:none}.dots i{width:8px;height:8px;border-radius:50%;background:var(--bg3)}.dots i.on{background:var(--y)}
.nowline{display:flex;align-items:center;gap:8px;padding:0 14px 0 25px;height:20px;color:var(--red);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.nowline.end{height:36px;padding-bottom:6px}
.box > .nowline:first-child{height:34px;padding-top:4px}
.nowline::after{content:"";flex:1;height:2px;background:var(--red);border-radius:2px}
.row.pop{animation:pop .45s ease}
@keyframes pop{30%{background:var(--ysoft)}}
.more{width:100%;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:14px;font-weight:500}

/* empty */
.empty{background:var(--bg2);border-radius:20px;padding:26px 20px}
.empty h2{font-size:20px;margin:0 0 6px}.empty p{margin:0 0 16px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:10px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{background:var(--bg3)} .chip small{color:var(--ink3);font-size:12px}
.foot{text-align:center;color:var(--ink3);font-size:12px;margin-top:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100svh - var(--st) - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.22,1,.36,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet.drag{transition:none}
.sgrab{padding:8px 0 2px;display:grid;place-items:center;flex:none}.sgrab i{width:38px;height:5px;border-radius:3px;background:var(--bg3)}
.shd{display:flex;align-items:center;gap:8px;padding:4px 16px 8px;flex:none}
.shd h3{margin:0;font-size:20px;font-weight:700;margin-inline-end:auto}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 8px;flex:1;-webkit-overflow-scrolling:touch}
.sfoot{flex:none;padding:10px 16px calc(12px + var(--sb));display:flex;gap:8px;border-top:1px solid var(--line)}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:500px;border-radius:22px;max-height:min(760px,calc(100vh - 60px));transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .22s,opacity .18s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sgrab{display:none}.shd{padding-top:18px}.sfoot{padding-bottom:16px}
}
.fl{margin:0 0 18px}
.lb{font-size:13px;color:var(--ink2);margin:0 0 7px;display:flex;justify-content:space-between;gap:8px}
.in{width:100%;height:50px;border-radius:12px;border:2px solid transparent;background:var(--bg2);padding:0 14px;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--y);background:var(--bg)}
.sugg{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none;overscroll-behavior-x:contain}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{flex:none;height:32px;background:var(--bg2);box-shadow:none;font-size:13px}
.kinds{display:grid;gap:6px}
.kind{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--bg2);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}
.kind.on{box-shadow:inset 0 0 0 2px var(--y);background:var(--ysoft)}
.kind .ki{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.kind.on .ki{background:var(--y);color:#000}
.kind b{display:block;font-size:15px;font-weight:700}.kind span{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.line{display:flex;gap:8px;align-items:center}
.step{display:flex;align-items:center;background:var(--bg2);border-radius:12px;height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}.step button:active{background:var(--bg3)}
.step output{min-width:30px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;flex:1;height:44px}
.seg button{flex:1;border-radius:9px;font-size:14px;font-weight:500;text-align:center;color:var(--ink2)}
.seg button.on{background:var(--seg);box-shadow:var(--segsh);color:var(--ink)}
.times{display:flex;flex-wrap:wrap;gap:8px}
.tchip{height:40px;padding:0 6px 0 12px;border-radius:11px;background:var(--y);color:#000;display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tchip button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}.tchip button:hover{background:rgba(0,0,0,.08)}
.tadd{height:40px;padding:0 12px;border-radius:11px;background:var(--bg2);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.picker{margin-top:10px;background:var(--bg2);border-radius:16px;padding:10px;display:none}
.picker.on{display:block}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:4px;height:200px}
.wheel::before{content:"";position:absolute;left:0;right:0;top:80px;height:40px;border-radius:10px;background:var(--bg)}
.col{position:relative;width:76px;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);touch-action:pan-y}
.col::-webkit-scrollbar{display:none}
.col div{height:40px;line-height:40px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;scroll-snap-align:center}
.col .pad{scroll-snap-align:none;height:80px}
.colon{position:relative;font-size:24px;font-weight:700}
.prow{display:flex;gap:6px;margin-top:10px}
.prow .chip{flex:1;justify-content:center;padding:0 6px;height:34px;font-size:13px}
.dbtn{width:100%;height:50px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:16px;font-weight:500}
.dbtn .chev{margin-inline-start:auto;transition:transform .2s;color:var(--ink3)}.dbtn.open .chev{transform:rotate(180deg)}
.cal{margin-top:8px;background:var(--bg2);border-radius:16px;padding:10px;display:none}.cal.on{display:block}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh b{font-size:15px;text-transform:capitalize}
.calh button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.calh button:hover{background:var(--bg3)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg span{font-size:12px;color:var(--ink3);padding:4px 0;text-transform:capitalize}
.calg button{height:40px;border-radius:10px;font-size:15px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.calg button:hover{background:var(--bg3)}
.calg button.td{box-shadow:inset 0 0 0 2px var(--line2)}
.calg button.sel{background:var(--y);color:#000;font-weight:700;box-shadow:none}
.calg button:disabled{color:var(--ink3);opacity:.5;pointer-events:none}
.hint{font-size:13px;color:var(--ink2);margin:10px 2px 0;line-height:1.4}
.btn{height:50px;border-radius:12px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:500;background:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:#000;flex:1}.btn.y:hover{background:var(--yh)}
.btn.ic{width:50px;padding:0}
.btn.armed{background:var(--red);color:#fff;width:auto;padding:0 14px}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--sb));z-index:60;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#1f1f1f;color:#fff;border-radius:14px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:calc(100vw - 24px);transition:opacity .2s,transform .25s}
html[data-theme="dark"] .toast{background:#333}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.stack{flex-wrap:wrap;width:calc(100vw - 24px);max-width:440px;padding:12px 8px 8px 16px;row-gap:6px}
.toast.stack #toastTx{white-space:normal;overflow:visible;flex:1 1 100%;line-height:1.35;padding-inline-end:8px}
.toast.stack #extraBtn,.toast.stack #extraBtn[style*="none"] + #undoBtn{margin-inline-start:auto}
.toast button{height:34px;padding:0 10px;border-radius:9px;color:var(--y);font-weight:700;display:flex;align-items:center;gap:5px;flex:none}
.toast button:hover{background:rgba(255,255,255,.1)}
@media (max-width:420px){.ib.pri .tx{display:none}.ib.pri{padding:0 10px}.day h1{font-size:25px}.clock{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#presets .chip{flex-direction:column;gap:0;height:48px;padding:0 4px;line-height:1.15;min-width:0}
#presets .chip small{font-size:12px}
.picker .btn:not(.y){background:var(--bg)}
.tgl{background:var(--bg2);border-radius:14px;margin-top:6px}
.tgh{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px}
.tgh .ot{flex:1;min-width:0}
.ot b{display:block;font-size:15px;font-weight:700}
.ot small{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.3}
.sw{width:46px;height:28px;border-radius:14px;background:var(--bg3);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on .sw{background:var(--y)}
.tgl.on .sw i{transform:translateX(18px)} html[dir="rtl"] .tgl.on .sw i{transform:translateX(-18px)}
.optx{display:flex;align-items:center;gap:10px;padding:0 14px 12px}
.optx .step{background:var(--bg)}
.ol{font-size:14px;color:var(--ink2);flex:1}
#fKind .seg{flex:1;min-width:0}
#fKind .seg button{padding:0 2px;white-space:nowrap;font-size:13px}
.sum{flex:none;display:flex;gap:10px;align-items:flex-start;margin:0 16px;padding:12px 14px;border-radius:14px;background:var(--ysoft);font-size:15px;line-height:1.35}
.sum svg{margin-top:1px}
.sum small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.empty .btn{margin-top:4px}
.kind.off{opacity:.45}
.kind.off .ki{background:var(--bg3)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.step button.dim{opacity:.35}
.row.missed .nm{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--red)}
.row.missed .ck{border-color:var(--red);border-style:dashed}
.row.sw-do{background:var(--ysoft)} .row.sw-later{background:var(--bg3)}
.cchip{margin-top:10px;height:32px;padding:0 11px;border-radius:9px;background:#000;color:var(--y);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.now.calm .cchip{background:var(--ink);color:var(--bg)}
.catch .shd h3{margin-inline-end:0}
.ccount{margin-inline-start:auto;margin-inline-end:6px;color:var(--ink2);font-size:14px}
.cdots{display:flex;gap:4px;padding:0 16px 4px}.cdots i{flex:1;height:4px;border-radius:2px;background:var(--bg3)}.cdots i.on{background:var(--y)}.cdots i.cur{background:var(--ink)}
.cstage{padding:14px 16px 6px;overflow:hidden;min-height:250px;display:flex}
.ccard{flex:1;background:var(--bg2);border-radius:24px;padding:26px 20px 18px;text-align:center;transition:transform .22s,opacity .22s,background .2s;touch-action:pan-y}
.ccard.in{animation:cin .28s ease}
@keyframes cin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.ccard.out-r{transform:translateX(120%) rotate(8deg);opacity:0}.ccard.out-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.ccard.lean-r{background:var(--ysoft)}.ccard.lean-l{background:var(--bg3)}
.ctime{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1;display:flex;justify-content:center;color:var(--ink)}
.cname{font-size:24px;font-weight:700;margin-top:12px;overflow-wrap:anywhere}
.clate{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:8px;background:var(--redsoft);color:var(--red);font-size:13px;font-weight:700}
.csub{color:var(--ink2);font-size:14px;margin-top:10px}
.chint{color:var(--ink3);font-size:12px;margin-top:18px}
.cbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 16px calc(14px + var(--sb))}
.cbtns .btn{font-size:14px;padding:0 8px;gap:6px;height:48px}
.cbtns .cwide{grid-column:1/-1;height:56px;font-size:17px;font-weight:700}
.cbtns .cmiss{color:var(--red)}
.cdone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;animation:cin .3s ease}
.cdone b{font-size:22px}.cdone small{color:var(--ink2);font-size:14px}
.cbig{width:72px;height:72px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;margin-bottom:6px}
.toast #extraBtn{color:#fff;background:rgba(255,255,255,.12)}
.mini{font-size:13px;color:var(--ink3);margin:12px 4px 6px}
.sh2+.mini{margin-top:2px}
.more.later{margin-top:-6px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

/* one column for every check, everywhere */

.seg.mode{flex:none}

/* fix: long status pills squeezed the name into one letter per line */

/* later sheet */

.cbulk button.r{color:var(--red)}

/* ================= Design system v2 — calm, trustworthy, native =================
   Blue = action & trust · Green = done (reward) · Orange = late (attention, not alarm)
   Red = only for missed / destructive · Neutral greys carry everything else.          */
:root{
  --font:"InterR",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  --bg:#f2f2f7; --bg2:#ffffff; --bg3:#e5e5ea; --line:rgba(60,60,67,.14); --line2:rgba(60,60,67,.29);
  --ink:#000; --ink2:rgba(60,60,67,.62); --ink3:rgba(60,60,67,.34);
  --y:#007aff; --yh:#0062cc; --ysoft:rgba(0,122,255,.09); --on:#fff;
  --ok:#34c759; --oksoft:rgba(52,199,89,.13);
  --late:#e8590c; --latesoft:rgba(255,149,0,.13);
  --red:#ff3b30; --redsoft:rgba(255,59,48,.10);
  --menu:#fff; --seg:#fff; --card-sh:0 1px 2px rgba(0,0,0,.04);
}
html[data-theme="dark"]{
  --bg:#000; --bg2:#1c1c1e; --bg3:#2c2c2e; --line:rgba(84,84,88,.5); --line2:rgba(235,235,245,.3);
  --ink:#fff; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.32);
  --y:#0a84ff; --yh:#3395ff; --ysoft:rgba(10,132,255,.16);
  --ok:#30d158; --oksoft:rgba(48,209,88,.16);
  --late:#ff9f0a; --latesoft:rgba(255,159,10,.15);
  --red:#ff453a; --redsoft:rgba(255,69,58,.15);
  --menu:#2c2c2e; --seg:#636366; --card-sh:none;
}
html[data-theme="dark"] .sheet{background:#1c1c1e}
html[data-theme="dark"] .sheet .in,html[data-theme="dark"] .sheet .kind,html[data-theme="dark"] .sheet .seg,html[data-theme="dark"] .sheet .step,
html[data-theme="dark"] .sheet .tgl,html[data-theme="dark"] .sheet .tadd,html[data-theme="dark"] .sheet .picker,html[data-theme="dark"] .sheet .wdays button,
html[data-theme="dark"] .sheet .mdays button,html[data-theme="dark"] .sheet .btn:not(.y):not(.armed),html[data-theme="dark"] .sheet .lopt,
html[data-theme="dark"] .sheet .box,html[data-theme="dark"] .sheet .ccard{background:#2c2c2e}
html[data-theme="dark"] .sheet .wheel::before{background:#3a3a3c}
body{font-size:16px;letter-spacing:-.011em}
.tab,.tm,.clock,.ctime{font-variant-numeric:tabular-nums}

/* header */
.logo{font-size:17px;font-weight:600;letter-spacing:-.02em}
.logo i{background:var(--y);color:#fff;width:26px;height:26px;border-radius:8px}

.h12 .clock{font-size:21px}
.meter{height:4px;gap:2px}.meter i{border-radius:2px}
.meter i.on{background:var(--ok)}.meter i.late{background:var(--late)}

/* hero */
.now,.now.calm{background:var(--bg2);color:var(--ink);border-radius:18px;padding:16px 16px 16px 18px;box-shadow:var(--card-sh);position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--y)}
.now.calm::before{background:var(--ok)}
.now.k-kLate::before{background:var(--late)}
.now.k-kNext::before{background:var(--ink3)}
.now-k{opacity:1;color:var(--ink2);font-size:13px;font-weight:600;letter-spacing:.01em}
.now.k-kNow .now-k,.now.k-kDue .now-k{color:var(--y)} .now.k-kLate .now-k{color:var(--late)}
.now-n{font-size:22px;font-weight:700;letter-spacing:-.02em}
.now-r{opacity:1;color:var(--ink2);font-size:15px}
.bigck{width:54px;height:54px;background:var(--ok);color:#fff;box-shadow:0 4px 14px rgba(52,199,89,.32)}
.now.calm .bigck{background:var(--y);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.28)}
.cchip{background:var(--ysoft);color:var(--y);font-weight:600;border-radius:10px;height:34px}
.cchip.ghost,.now.calm .cchip.ghost{background:var(--bg3);color:var(--ink)}
.now.calm .cchip{background:var(--ysoft);color:var(--y)}

/* sections & rows */
.sh2 h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.sh2 span{font-weight:500}
.sh2 em{font-weight:500}.sh2 em.red{color:var(--late)}
.mini{font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin:12px 16px 6px}
.box{border-radius:14px;box-shadow:var(--card-sh)}
.nm{font-size:17px;font-weight:400;letter-spacing:-.015em}
.sb{font-size:14px}
.tm{font-weight:600}
.ck{width:28px;height:28px;border:1.75px solid var(--line2);color:#fff}
.row.late .ck{border-color:var(--late)} .row.late .tm{color:var(--late)}
.row.lt .ck{border-color:var(--late)} .row.lt .tm{color:var(--late)}
.row.done .ck,.ck.on{background:var(--ok);border-color:var(--ok)}
.row.done .nm{text-decoration-color:var(--ink3)}
.row.missed .ck{border-color:var(--red)} .row.missed .nm{text-decoration-color:var(--red)}
.row.pop{animation:pop2 .5s ease}
@keyframes pop2{30%{background:var(--oksoft)}}
.ck.on{animation:ckpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes ckpop{40%{transform:scale(1.18)}}
.tag{font-weight:500;border-radius:7px;background:var(--bg3);color:var(--ink2)}
.tag.tnow{background:var(--y);color:#fff}
.tag.late{background:var(--latesoft);color:var(--late)}
.row.missed .tag.late{background:var(--redsoft);color:var(--red)}
.dots i{background:var(--bg3)}.dots i.on{background:var(--ok)}
.nowline{color:var(--red)}
.more{color:var(--y);font-weight:500}
.row.sw-do{background:var(--oksoft)}

/* controls */
.btn{font-weight:600;border-radius:13px}
.btn.y,.tchip,.kind.on .ki,.calg button.sel,.wdays button.on,.mdays button.on{background:var(--y);color:#fff}
.btn.y:hover{background:var(--yh)}
.in{border-radius:12px}
.tgl.on .sw{background:var(--ok)}
.seg button.on{font-weight:600}
.sum{background:var(--ysoft);color:var(--ink)}
.sum svg{color:var(--y)}
.lopt.best{background:var(--ysoft);box-shadow:inset 0 0 0 1.5px var(--y)}
.lopt em{color:var(--late)}
.toast{background:rgba(28,28,30,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px}
.toast button{color:#4da3ff}
.cdots i.on{background:var(--ok)}
.ccard.lean-r{background:var(--oksoft)}
.clate{background:var(--latesoft);color:var(--late)}
.cbig{background:var(--ok);color:#fff}
.cbtns .cmiss{color:var(--red)}
.empty{border-radius:18px;box-shadow:var(--card-sh)}
.wake{background:var(--bg2);border-radius:18px;padding:16px 18px;margin:0 0 14px;box-shadow:var(--card-sh)}
.wk-k{display:flex;align-items:center;gap:6px;color:#c77700;font-size:13px;font-weight:600}
html[data-theme="dark"] .wk-k{color:#ffb340}
.wk-q{font-size:21px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.wk-s{color:var(--ink2);font-size:14px;margin-top:3px}
.wk-b{display:flex;gap:8px;margin-top:14px}.wk-b .btn{height:46px;flex:1}.wk-b .btn:not(.y){background:var(--bg3)}
.wakebar{display:flex;align-items:center;gap:10px;background:var(--bg2);border-radius:14px;padding:0 6px 0 14px;height:48px;margin:0 0 12px;box-shadow:var(--card-sh)}
.wk-i{color:#e08a00}.wk-t{flex:1;font-size:15px;font-weight:500;line-height:1.2;min-width:0}
button.wk-t{text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0}
.wk-t small b{color:var(--y);font-weight:600}
.wk-t small{display:block;font-size:12.5px;font-weight:400;color:var(--ink2);margin-top:2px}
.wakebar{height:auto;min-height:52px;padding-top:6px;padding-bottom:6px}
.wk-n{height:34px;padding:0 12px;border-radius:999px;background:var(--ysoft);color:var(--y);font-weight:600;font-size:14px;white-space:nowrap;flex:none}
.wk-n:active{opacity:.7}
.wk-e{height:36px;padding:0 14px;border-radius:10px;color:var(--y);font-weight:600;font-size:15px}.wk-e:active{background:var(--ysoft)}
.row.wwait .tm{color:#e08a00}
.tchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tchips .lopt{min-height:56px}
.tchips:empty{display:none}.tchips:not(:empty){margin-bottom:12px}
.wheel{direction:ltr}
.tday{display:flex;width:100%}.tday button{flex:1}
.tread{text-align:center;color:var(--ink2);font-size:14.5px;margin:12px 0 0;min-height:20px}
.tread.bad{color:var(--red)}
.sugg .chip.on{background:var(--y);color:#fff}
.clink{grid-column:1/-1;height:36px;color:var(--y);font-size:14px;font-weight:600;text-align:center}
#tScrim{z-index:56}#tsheet{z-index:57}
html[data-theme="dark"] .sheet .sugg .chip:not(.on){background:#2c2c2e}
.day h1{font-size:clamp(23px,6.6vw,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day>div:first-child{min-width:0}

/* UI polish v3 */
.sum{margin:10px 16px 14px;align-items:center}
.sfoot{border-top:0;padding-top:0}
.sw{background:rgba(120,120,128,.2)}
html[data-theme="dark"] .sw{background:rgba(120,120,128,.36)}

.tgl > .optx:first-child{padding:10px 14px;min-height:56px}
.line .step button{width:40px}
.line .seg{min-width:0}
.line .seg button{min-width:0;padding:0 2px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.seg button{min-width:0}
.seg{background:rgba(118,118,128,.12);gap:2px}
html[data-theme="dark"] .seg{background:rgba(118,118,128,.24)}
.seg button.on{background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
html[data-theme="dark"] .seg button.on{background:#636366;box-shadow:none}
html[data-theme="dark"] .sw{background:rgba(120,120,128,.5)}
.day h1{white-space:normal;overflow:visible;text-overflow:clip}
@media (max-width:360px){.hdr-in{padding:0 12px;gap:6px}.logo{font-size:0;gap:0}.ib{min-width:38px;height:38px;padding:0 8px}.day h1{font-size:23px}}
@media (max-width:360px){#fKind .line{flex-wrap:wrap}#fKind .line .seg{flex:1 1 100%}}
.in.desc{display:block;margin-top:8px;height:auto;min-height:50px;padding:13px 14px;resize:none;line-height:1.4;font:inherit;font-size:16px;color:inherit;overflow-y:auto}
.ds{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.row.done .ds,#all .row.paused .ds{color:var(--ink3)}
.now-d{font-size:14px;opacity:.75;margin-bottom:2px;line-height:1.35;white-space:pre-line;overflow-wrap:anywhere}
.nm,.sb,.now-n,.now-r{unicode-bidi:plaintext}
html[dir=rtl] .nm,html[dir=rtl] .sb,html[dir=rtl] .now-n,html[dir=rtl] .now-r{text-align:right}
html[dir=rtl] .ds,html[dir=rtl] .now-d{width:fit-content;max-width:100%;margin-left:auto;margin-right:0}
/* motion: one curve everywhere (iOS sheet curve), quicker on the way out */
.sheet{transition:transform .28s cubic-bezier(.32,.72,0,1),visibility 0s linear .28s;will-change:transform}
.sheet.on{transition:transform .44s cubic-bezier(.32,.72,0,1),visibility 0s}
.sheet.drag{transition:none}
.scrim{transition:opacity .28s ease}
.scrim.on{transition:opacity .36s ease}
@media (min-width:700px){.sheet{transition:transform .22s cubic-bezier(.32,.72,0,1),opacity .18s,visibility 0s linear .22s}.sheet.on{transition:transform .32s cubic-bezier(.32,.72,0,1),opacity .2s,visibility 0s}}
html.lock .sbody,html.lock #aList{overscroll-behavior:contain}
.ds:not(.open){display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.dsm{display:block;width:fit-content;margin-top:1px;padding:4px 10px 4px 0;margin-bottom:-2px;font-size:13px;font-weight:600;color:var(--y);cursor:pointer;-webkit-tap-highlight-color:transparent}
.dsm[hidden]{display:none}

.dsm:active{opacity:.5}
html[dir=rtl] .dsm{margin-left:auto;padding:4px 0 4px 10px}
#all .ds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.unset{font-size:15px;font-weight:500;color:var(--ink3);white-space:nowrap}
.need{margin:8px 2px 0;font-size:13px;font-weight:600;color:var(--red);width:100%}
.tm.day{display:block;width:56px;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm.day small{margin-top:2px;font-size:11px;white-space:nowrap}

/* small / older Android phones and large system text: give the name column the room */
@media (max-width:380px){
  .wrap{padding-left:calc(12px + var(--sl));padding-right:calc(12px + var(--sr))}
  .row{gap:10px;padding-left:12px;padding-right:12px}
  .ck{width:26px;height:26px}
  .tm{width:44px;font-size:14px}.h12 .tm,.h12 .nowline b{width:56px}
  .tm.day{width:50px;font-size:13px}.h12 .tm.day{width:56px}
  .wakebar{gap:8px;padding-left:12px}
  button.wk-t{white-space:normal;overflow:visible}
  .wk-t{font-size:14px}.wk-n{font-size:13px;padding:0 10px;height:32px;max-width:46%;white-space:normal;line-height:1.1;text-align:center}
}

.wakebar.long .wk-t small{color:#c77700}html[data-theme="dark"] .wakebar.long .wk-t small{color:#ffb340}

/* ===== v31: calmer, denser layout — tabs with stats, plain lists, one-line status ===== */
:root{--page:#fff;--card:#f2f2f7}
html[data-theme="dark"]{--page:#000;--card:#1c1c1e}
@media (prefers-color-scheme:dark){html:not([data-theme="light"]){--page:#000;--card:#1c1c1e}}
html,body,.hdr{background:var(--page)}
.meter{display:none!important}
.day{margin:2px 0 12px}.day h1{font-size:24px}.clock{font-size:24px}.day p{font-size:13px;margin-top:3px}
.wakebar{background:var(--card);box-shadow:none;min-height:46px;margin-bottom:10px;border-radius:14px}
.now{background:var(--card)!important;box-shadow:none!important;padding:12px 14px 12px 16px;margin-bottom:14px;border-radius:16px;gap:12px}
.now-n{font-size:19px}.now-r{font-size:13px}.now-k{font-size:12px}
.bigck{width:48px;height:48px}
.now .now-acts{margin-top:8px}
/* tabs: three periods side by side, each with its own progress */
.tabs{position:sticky;top:calc(58px + var(--st));z-index:15;display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;padding:6px 0 10px;margin:0 0 4px;background:var(--page)}
.tb{display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:start;padding:9px 10px 8px;border-radius:13px;background:var(--card);min-width:0;transition:background .2s,box-shadow .2s}
.tb.on{background:var(--page);box-shadow:inset 0 0 0 1.5px var(--y)}
.tb-h{display:flex;align-items:baseline;justify-content:space-between;gap:4px;min-width:0}
.tb-h b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-h .tab{font-size:13px;font-weight:600;color:var(--ink2)}
.tb.on .tb-h b{color:var(--y)}
.tb-bar{height:4px;border-radius:2px;background:var(--bg3);overflow:hidden}
.tb-bar i{display:block;height:100%;background:var(--ok);border-radius:2px;transition:width .4s}
.tb-s{font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-s.red{color:var(--red)}
.tb.full .tb-h .tab{color:var(--ok)}
/* groups: a small label and a plain list — no boxes */
.grp{margin:0 0 14px}
.gh{display:flex;align-items:baseline;gap:8px;margin:8px 2px 2px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
html[lang="ar"] .gh{letter-spacing:0}
#app .box{background:transparent;border-radius:0;box-shadow:none;overflow:visible}
#app .row{min-height:48px;padding:7px 2px;gap:10px}
#app .row+.row::before{inset-inline:38px 0}
#app .ck{width:26px;height:26px}
#app .tm{font-size:14px}
#app .nm{font-size:15.5px;line-height:1.28}
#app .sb{font-size:12.5px;margin-top:1px;line-height:1.35}
#app .ds{font-size:12.5px;-webkit-line-clamp:1}
#app .ds:not(.open){display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.st{font-weight:600;color:var(--ink2)}
.st.tnow{color:var(--y)}.st.late{color:var(--red)}.st.ok{color:var(--ink3);font-weight:500}
.row.done .st{color:var(--ink3);font-weight:500}
.nowline{padding-inline:0 2px;padding-left:8px}
