<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Routines</title>
<meta name="description" content="Your day, hour by hour. Check every task.">
<meta name="apple-mobile-web-app-title" content="Routines">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Routines">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="theme-color" id="themeColor" content="#ffffff">
<link rel="manifest" href="manifest.json">
<script>
/* no zoom, no double-tap zoom, no pinch — same rules as a native app */
(function(){
  ["gesturestart","gesturechange","gestureend"].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener("touchmove", function(e){
    if((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) e.preventDefault();
  }, {passive:false});
  var lastTap = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if(now - lastTap <= 320 && !(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
    lastTap = now;
  }, {passive:false});
  /* no copy, no selection, no long-press menu (fields excepted) */
  function field(t){ return t && t.closest && t.closest("input,textarea,[contenteditable]"); }
  ["selectstart","contextmenu","dragstart","copy","cut"].forEach(function(ev){
    document.addEventListener(ev, function(e){ if(!field(e.target)) e.preventDefault(); }, {capture:true});
  });
  /* iOS can leave the page scaled or nudged sideways after typing — put it back */
  function unzoom(){
    var m = document.querySelector('meta[name="viewport"]');
    if(m){ var c = m.getAttribute("content"); m.setAttribute("content", c + " "); m.setAttribute("content", c); }
    if(window.pageXOffset) window.scrollTo(0, window.pageYOffset);
  }
  document.addEventListener("focusout", function(){ setTimeout(unzoom, 60); }, true);
  window.addEventListener("orientationchange", function(){ setTimeout(unzoom, 250); });
  document.addEventListener("scroll", function(){ if(window.pageXOffset) window.scrollTo(0, window.pageYOffset); }, {passive:true});
  if("scrollRestoration" in history) history.scrollRestoration = "manual";
})();
</script>
<style>
:root{
  --bg:#fff; --bg2:#f5f5f6; --bg3:#ebebed; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.2);
  --ink:#000; --ink2:rgba(0,0,0,.58); --ink3:rgba(0,0,0,.36);
  --y:#fc0; --y2:#ffdb4d; --yh:#f5c400; --ysoft:#fff6d1;
  --red:#f33; --redsoft:#ffeceb;
  --menu:#fff; --pop:0 8px 30px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);
  --seg:#fff; --segsh:0 1px 3px rgba(0,0,0,.12);
  --font:"YS Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
html[data-theme="dark"]{
  --bg:#121212; --bg2:#1f1f1f; --bg3:#2b2b2b; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.24);
  --ink:#fff; --ink2:rgba(255,255,255,.6); --ink3:rgba(255,255,255,.36);
  --ysoft:rgba(255,204,0,.13); --red:#ff5c4d; --redsoft:rgba(255,51,51,.14);
  --menu:#262626; --pop:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
  --seg:#3a3a3a; --segsh:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{color:var(--ink);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;min-height:100svh}
input{font:inherit;font-size:16px;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
svg{display:block;flex:none}
.tab{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:var(--st) var(--sr) 0 var(--sl);transition:box-shadow .2s}
.hdr.sh{box-shadow:0 1px 0 var(--line)}
.hdr-in{max-width:680px;margin:0 auto;height:58px;padding:0 16px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:-.01em;margin-inline-end:auto}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--y);display:grid;place-items:center;color:#000}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;transition:background .15s}
.ib:hover{background:var(--bg3)} .ib:active{transform:scale(.96)}
.ib.pri{background:var(--y);color:#000;padding:0 14px 0 11px}.ib.pri:hover{background:var(--yh)}
.ib .lc{font-size:13px;font-weight:700;text-transform:uppercase}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;min-width:210px;max-width:calc(100vw - 24px);background:var(--menu);border-radius:14px;box-shadow:var(--pop);padding:6px;z-index:30;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .14s,transform .14s}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}
.mh{font-size:12px;color:var(--ink3);padding:6px 10px 4px}
.mi{width:100%;height:42px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:10px;font-size:15px}
.mi:hover{background:var(--bg2)} .mk{margin-inline-start:auto;opacity:0;display:flex} .mi.sel .mk{opacity:1}
.msep{height:1px;background:var(--line);margin:5px 6px}

/* page */
.wrap{max-width:680px;margin:0 auto;padding:6px calc(16px + var(--sr)) calc(48px + var(--sb)) calc(16px + var(--sl))}
.day{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 12px}
.day h1{font-size:28px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.02em}
.day p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.clock{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.meter{display:flex;gap:3px;height:6px;margin:0 0 16px}
.meter i{flex:1;border-radius:3px;background:var(--bg3);transition:background .3s}
.meter i.on{background:var(--y)} .meter i.late{background:var(--red)}

/* now card */
.now{background:var(--y);color:#000;border-radius:20px;padding:16px 16px 16px 18px;display:flex;align-items:center;gap:14px;margin:0 0 26px}
.now.calm{background:var(--bg2);color:var(--ink)}
.now-tx{flex:1;min-width:0}
.now-k{font-size:13px;font-weight:500;opacity:.66;display:flex;gap:6px;align-items:center}
.now-k b{background:#000;color:var(--y);font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
.now-n{font-size:22px;font-weight:700;line-height:1.15;margin:3px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now-r{font-size:14px;opacity:.75}
.bigck{width:60px;height:60px;border-radius:50%;background:#000;color:var(--y);display:grid;place-items:center;flex:none;transition:transform .15s}
.bigck:active{transform:scale(.92)}
.now.calm .bigck{background:var(--y);color:#000}

/* sections */
.sec{margin:0 0 24px}
.sh2{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.sh2 h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.sh2 span{color:var(--ink3);font-size:14px}
.sh2 em{font-style:normal;margin-inline-start:auto;color:var(--ink2);font-size:13px}
.sh2 em.red{color:var(--red)}
.box{background:var(--bg2);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;position:relative;transition:opacity .3s,background .2s}
.row+.row::before{content:"";position:absolute;top:0;inset-inline:56px 0;height:1px;background:var(--line)}
.row.timed+.row::before,.row.timed::before{inset-inline-start:72px}
.tm{width:46px;flex:none;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tm small{display:block;font-size:12px;font-weight:400;color:var(--ink3)}
.row.late .tm{color:var(--red)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .15s;color:#000}
.ck svg{opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.ck:active{transform:scale(.88)}
.row.late .ck{border-color:var(--red)}
.row.done .ck,.ck.on{background:var(--y);border-color:var(--y)}
.row.done .ck svg,.ck.on svg{opacity:1;transform:none}
.bd{flex:1;min-width:0;padding:4px 0}
.nm{font-size:16px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:13px;color:var(--ink2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.done .nm{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.row.done .sb{color:var(--ink3)}
.tag{flex:none;font-size:12px;font-weight:500;padding:4px 8px;border-radius:8px;background:var(--bg3);color:var(--ink2);white-space:nowrap}
.tag.now{background:var(--y);color:#000}.tag.late{background:var(--redsoft);color:var(--red)}
.dots{display:flex;gap:4px;flex:none}.dots i{width:8px;height:8px;border-radius:50%;background:var(--bg3)}.dots i.on{background:var(--y)}
.nowline{display:flex;align-items:center;gap:8px;padding:0 14px;height:20px;color:var(--red);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.nowline::after{content:"";flex:1;height:2px;background:var(--red);border-radius:2px}
.row.pop{animation:pop .45s ease}
@keyframes pop{30%{background:var(--ysoft)}}
.more{width:100%;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:14px;font-weight:500}

/* empty */
.empty{background:var(--bg2);border-radius:20px;padding:26px 20px}
.empty h2{font-size:20px;margin:0 0 6px}.empty p{margin:0 0 16px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:10px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{background:var(--bg3)} .chip small{color:var(--ink3);font-size:12px}
.foot{text-align:center;color:var(--ink3);font-size:12px;margin-top:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100svh - var(--st) - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.22,1,.36,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet.drag{transition:none}
.sgrab{padding:8px 0 2px;display:grid;place-items:center;flex:none}.sgrab i{width:38px;height:5px;border-radius:3px;background:var(--bg3)}
.shd{display:flex;align-items:center;gap:8px;padding:4px 16px 8px;flex:none}
.shd h3{margin:0;font-size:20px;font-weight:700;margin-inline-end:auto}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 8px;flex:1;-webkit-overflow-scrolling:touch}
.sfoot{flex:none;padding:10px 16px calc(12px + var(--sb));display:flex;gap:8px;border-top:1px solid var(--line)}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:500px;border-radius:22px;max-height:min(760px,calc(100vh - 60px));transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .22s,opacity .18s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sgrab{display:none}.shd{padding-top:18px}.sfoot{padding-bottom:16px}
}
.fl{margin:0 0 18px}
.lb{font-size:13px;color:var(--ink2);margin:0 0 7px;display:flex;justify-content:space-between;gap:8px}
.in{width:100%;height:50px;border-radius:12px;border:2px solid transparent;background:var(--bg2);padding:0 14px;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--y);background:var(--bg)}
.sugg{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none;overscroll-behavior-x:contain}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{flex:none;height:32px;background:var(--bg2);box-shadow:none;font-size:13px}
.kinds{display:grid;gap:6px}
.kind{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--bg2);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}
.kind.on{box-shadow:inset 0 0 0 2px var(--y);background:var(--ysoft)}
.kind .ki{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.kind.on .ki{background:var(--y);color:#000}
.kind b{display:block;font-size:15px;font-weight:700}.kind span{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.line{display:flex;gap:8px;align-items:center}
.step{display:flex;align-items:center;background:var(--bg2);border-radius:12px;height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}.step button:active{background:var(--bg3)}
.step output{min-width:30px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;flex:1;height:44px}
.seg button{flex:1;border-radius:9px;font-size:14px;font-weight:500;text-align:center;color:var(--ink2)}
.seg button.on{background:var(--seg);box-shadow:var(--segsh);color:var(--ink)}
.times{display:flex;flex-wrap:wrap;gap:8px}
.tchip{height:40px;padding:0 6px 0 12px;border-radius:11px;background:var(--y);color:#000;display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tchip button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}.tchip button:hover{background:rgba(0,0,0,.08)}
.tadd{height:40px;padding:0 12px;border-radius:11px;background:var(--bg2);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.picker{margin-top:10px;background:var(--bg2);border-radius:16px;padding:10px;display:none}
.picker.on{display:block}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:4px;height:200px}
.wheel::before{content:"";position:absolute;left:0;right:0;top:80px;height:40px;border-radius:10px;background:var(--bg)}
.col{position:relative;width:76px;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);touch-action:pan-y}
.col::-webkit-scrollbar{display:none}
.col div{height:40px;line-height:40px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;scroll-snap-align:center}
.col .pad{scroll-snap-align:none;height:80px}
.colon{position:relative;font-size:24px;font-weight:700}
.prow{display:flex;gap:6px;margin-top:10px}
.prow .chip{flex:1;justify-content:center;padding:0 6px;height:34px;font-size:13px}
.dbtn{width:100%;height:50px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:16px;font-weight:500}
.dbtn .chev{margin-inline-start:auto;transition:transform .2s;color:var(--ink3)}.dbtn.open .chev{transform:rotate(180deg)}
.cal{margin-top:8px;background:var(--bg2);border-radius:16px;padding:10px;display:none}.cal.on{display:block}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh b{font-size:15px;text-transform:capitalize}
.calh button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.calh button:hover{background:var(--bg3)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg span{font-size:12px;color:var(--ink3);padding:4px 0;text-transform:capitalize}
.calg button{height:40px;border-radius:10px;font-size:15px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.calg button:hover{background:var(--bg3)}
.calg button.td{box-shadow:inset 0 0 0 2px var(--line2)}
.calg button.sel{background:var(--y);color:#000;font-weight:700;box-shadow:none}
.calg button:disabled{color:var(--ink3);opacity:.5;pointer-events:none}
.hint{font-size:13px;color:var(--ink2);margin:10px 2px 0;line-height:1.4}
.btn{height:50px;border-radius:12px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:500;background:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:#000;flex:1}.btn.y:hover{background:var(--yh)}
.btn.ic{width:50px;padding:0}
.btn.armed{background:var(--red);color:#fff;width:auto;padding:0 14px}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--sb));z-index:60;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#1f1f1f;color:#fff;border-radius:14px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:calc(100vw - 24px);transition:opacity .2s,transform .25s}
html[data-theme="dark"] .toast{background:#333}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{height:34px;padding:0 10px;border-radius:9px;color:var(--y);font-weight:700;display:flex;align-items:center;gap:5px;flex:none}
.toast button:hover{background:rgba(255,255,255,.1)}
@media (max-width:420px){.ib.pri .tx{display:none}.ib.pri{padding:0 10px}.day h1{font-size:25px}.clock{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#presets .chip{flex-direction:column;gap:0;height:48px;padding:0 4px;line-height:1.15;min-width:0}
#presets .chip small{font-size:12px}
.picker .btn:not(.y){background:var(--bg)}
.tgl{background:var(--bg2);border-radius:14px;margin-top:6px}
.tgh{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px}
.tgh .ot{flex:1;min-width:0}
.ot b{display:block;font-size:15px;font-weight:700}
.ot small{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.3}
.sw{width:46px;height:28px;border-radius:14px;background:var(--bg3);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on .sw{background:var(--y)}
.tgl.on .sw i{transform:translateX(18px)} html[dir="rtl"] .tgl.on .sw i{transform:translateX(-18px)}
.optx{display:flex;align-items:center;gap:10px;padding:0 14px 12px}
.optx .step{background:var(--bg)}
.ol{font-size:14px;color:var(--ink2);flex:1}
#fKind .seg{flex:1;min-width:0}
#fKind .seg button{padding:0 2px;white-space:nowrap;font-size:13px}
.sum{flex:none;display:flex;gap:10px;align-items:flex-start;margin:0 16px;padding:12px 14px;border-radius:14px;background:var(--ysoft);font-size:15px;line-height:1.35}
.sum svg{margin-top:1px}
.sum small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.empty .btn{margin-top:4px}
.kind.off{opacity:.45}
.kind.off .ki{background:var(--bg3)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.step button.dim{opacity:.35}
.row.missed .nm{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--red)}
.row.missed .ck{border-color:var(--red);border-style:dashed}
.row.sw-do{background:var(--ysoft)} .row.sw-later{background:var(--bg3)}

/* date: own calendar, never the system picker */
$("dateBtn").addEventListener("click", function(){ var o = !$("cal").classList.contains("on"); $("cal").classList.toggle("on", o); this.classList.toggle("open", o); if(o){ paintCal(); setTimeout(function(){ $("cal").scrollIntoView({block:"nearest", behavior:"smooth"}); }, 30); } });
function paintCal(){
  var td = today(), first = new Date(calMonth), off = (first.getDay() + 6) % 7, days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  var canBack = first > new Date(td.getFullYear(), td.getMonth(), 1, 0);
  var h = '<div class="calh"><button type="button" data-mon="-1"'+(canBack ? '' : ' disabled style="opacity:.25"')+' aria-label="Previous">'+ico(lang === "ar" ? "right" : "left")+'</button><b>'+esc(fmt(first, {month:"long", year:"numeric"}))+'</b><button type="button" data-mon="1" aria-label="Next">'+ico(lang === "ar" ? "left" : "right")+'</button></div><div class="calg">';
  var mon = weekStart(td), i; for(i = 0; i < 7; i++) h += '<span>'+esc(fmt(addDays(mon, i), {weekday:"narrow"}))+'</span>';
  for(i = 0; i < off; i++) h += '<i></i>';
  for(var d = 1; d <= days; d++){
    var dt = new Date(first.getFullYear(), first.getMonth(), d, 12), s = iso(dt);
    h += '<button type="button" data-day="'+s+'" class="tab'+(s === iso(td) ? " td" : "")+(s === F.date ? " sel" : "")+'"'+(dt < td ? " disabled" : "")+'>'+fmt(dt, {day:"numeric"})+'</button>';
  }
  h += '</div><div class="prow"><button type="button" class="chip" data-quick="0">'+esc(t("today"))+'</button><button type="button" class="chip" data-quick="1">'+esc(t("tomorrow"))+'</button><button type="button" class="chip" data-quick="7">'+esc(t("nextWeek"))+'</button></div>';
  $("cal").innerHTML = h;
}

/* time: own scroll wheels, never the system picker */
var wheelBuilt = false;
function buildWheels(){
  var h = '<div class="pad"></div>', i; for(i = 0; i < 24; i++) h += '<div data-v="'+i+'">'+("0"+i).slice(-2)+'</div>'; $("wH").innerHTML = h + '<div class="pad"></div>';
  h = '<div class="pad"></div>'; for(i = 0; i < 60; i += 5) h += '<div data-v="'+i+'">'+("0"+i).slice(-2)+'</div>'; $("wM").innerHTML = h + '<div class="pad"></div>';
  ["wH","wM"].forEach(function(id){
    var c = $(id), tm = null;
    c.addEventListener("scroll", function(){ clearTimeout(tm); tm = setTimeout(function(){ var k = Math.round(c.scrollTop / 40); if(c._k !== k){ c._k = k; buzz(3); } }, 60); }, {passive:true});
    c.addEventListener("click", function(e){ var d = e.target.closest("[data-v]"); if(d){ var k = [].indexOf.call(c.children, d) - 1; c.scrollTo({top:k*40, behavior:"smooth"}); } });
  });
  $("presets").innerHTML = [["morning","08:00"],["noon","13:00"],["evening","20:00"],["night","23:00"]].map(function(p){ return '<button type="button" class="chip" data-pre="'+p[1]+'">'+esc(t(p[0]))+' <small class="tab">'+p[1]+'</small></button>'; }).join("");
  $("presets").addEventListener("click", function(e){ var b = e.target.closest("[data-pre]"); if(b) setWheels(mins(b.getAttribute("data-pre")), true); });
  wheelBuilt = true;
}
function setWheels(m, smooth){
  var bh = smooth ? "smooth" : "auto";
  $("wH").scrollTo({top:Math.floor(m/60)*40, behavior:bh});
  $("wM").scrollTo({top:Math.min(11, Math.round((m % 60)/5))*40, behavior:bh});
}
function openPicker(){
  if(!wheelBuilt) buildWheels();
  $("picker").classList.add("on");
  var v = F.unit === "h" && F.times.length ? mins(F.times[0]) : F.times.length ? mins(F.times[F.times.length-1]) + 60 : Math.ceil((nowMin() + 1)/60)*60;
  if(v >= 1440) v = 1380;
  requestAnimationFrame(function(){ setWheels(v, false); $("picker").scrollIntoView({block:"nearest", behavior:"smooth"}); });
}
$("pCancel").addEventListener("click", function(){ $("picker").classList.remove("on"); });
$("pAdd").addEventListener("click", function(){
  var h = Math.min(23, Math.max(0, Math.round($("wH").scrollTop/40))), m = Math.min(55, Math.max(0, Math.round($("wM").scrollTop/40)*5));
  var v = hm(h*60 + m); if(F.unit === "h") F.times = [v]; else if(F.times.indexOf(v) < 0) F.times.push(v); F.times.sort();
  $("picker").classList.remove("on"); paintSheet(); buzz(10);
});

/* save / skip / delete (two taps — no system confirm box) */
$("saveBtn").addEventListener("click", function(){
  var name = $("fName").value.trim();
  if(!name){ $("fName").focus(); $("fName").placeholder = t("needName"); buzz([10,50,10]); return; }
  var before = snap(), it = editing ? JSON.parse(JSON.stringify(editing)) : {id:uid(), last:null, log:[]};
  var flex = F.mode === "flex", kind = flex ? "window" : "fixed", times = flex ? [] : F.times.slice().sort(), n = flex ? 1 : N();
  var changed = !editing || editing.kind !== kind || editing.n !== n || editing.unit !== F.unit || editing.next !== F.date || (F.unit === "h" && editing.times[0] !== times[0]);
  it.name = name; it.kind = kind; it.n = n; it.unit = flex ? "d" : F.unit; it.quota = F.quota; it.period = flex ? F.unit : "w"; it.times = times; it.shift = !flex && F.shift;
  if(changed){ it.next = F.date; it.anchor = F.date; it.at0 = times[0] || null; it.prev = null; it.slots = null; }
  var n = norm(it);
  if(editing) items[items.indexOf(editing)] = n; else items.push(n);
  save(); closeSheet(); lastHTML = ""; render(); buzz(10);
  if(!editing) toast(t("added", {n:name}), before);
});
$("skipBtn").addEventListener("click", function(){
  if(!editing) return; var before = snap(), it = editing;
  skipItem(it);
  save(); closeSheet(); lastHTML = ""; render();
  toast(t("skipped", {d:fmt(parse(it.next), {weekday:"short", day:"numeric", month:"short"})}), before);
});
var armT = null;
function disarm(){ clearTimeout(armT); $("delBtn").classList.remove("armed"); $("delTx").textContent = ""; }
$("delBtn").addEventListener("click", function(){
  if(!editing) return;
  if(!this.classList.contains("armed")){ this.classList.add("armed"); $("delTx").textContent = t("del2"); buzz(20); armT = setTimeout(disarm, 3000); return; }
  var before = snap(), id = editing.id;
  items = items.filter(function(i){ return i.id !== id; });
  save(); closeSheet(); lastHTML = ""; render(); toast(t("removed"), before);
});

/* swipe the sheet down to close */
(function(){
  var y0 = null, dy = 0, sh = $("sheet");
  function start(e){ if(window.innerWidth >= 700) return; y0 = e.touches[0].clientY; dy = 0; sh.classList.add("drag"); }
  function move(e){ if(y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = "translateY(" + dy + "px)"; if(e.cancelable) e.preventDefault(); }
  function end(){ if(y0 === null) return; sh.classList.remove("drag"); y0 = null; if(dy > 90) closeSheet(); else sh.style.transform = ""; }
  [$("grab"), $("shHead")].forEach(function(el){ el.addEventListener("touchstart", start, {passive:true}); el.addEventListener("touchmove", move, {passive:false}); el.addEventListener("touchend", end); el.addEventListener("touchcancel", end); });
})();

/* ---------- menus ---------- */
function closeMenus(){ document.querySelectorAll(".dd.open").forEach(function(d){ d.classList.remove("open"); d.querySelector("[data-dd]").setAttribute("aria-expanded", "false"); }); }
document.addEventListener("click", function(e){
  var b = e.target.closest("[data-dd]");
  if(b){ var p = b.parentNode, was = p.classList.contains("open"); closeMenus(); if(!was){ p.classList.add("open"); b.setAttribute("aria-expanded", "true"); buzz(4); } return; }
  if(!e.target.closest(".menu")) closeMenus();
});
document.querySelectorAll("[data-theme-choice]").forEach(function(b){ b.addEventListener("click", function(){ set("r.theme", b.getAttribute("data-theme-choice")); applyTheme(); closeMenus(); }); });
document.querySelectorAll("[data-lang-choice]").forEach(function(b){ b.addEventListener("click", function(){ lang = b.getAttribute("data-lang-choice"); set("r.lang", lang); applyLang(); closeMenus(); }); });
function applyTheme(){
  var th = get("r.theme") || "auto";
  var dark = th === "dark" || (th === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  $("themeColor").setAttribute("content", dark ? "#121212" : "#ffffff");
  $("themeIco").innerHTML = ico(th === "auto" ? "auto" : dark ? "moon" : "sun");
  document.querySelectorAll("[data-theme-choice]").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-theme-choice") === th); });
}
if(window.matchMedia){ var mq = matchMedia("(prefers-color-scheme: dark)"); if(mq.addEventListener) mq.addEventListener("change", applyTheme); else mq.addListener(applyTheme); }
function applyLang(){
  document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  $("langCode").textContent = lang;
  document.querySelectorAll("[data-t]").forEach(function(n){ n.textContent = t(n.getAttribute("data-t")); });
  document.querySelectorAll("[data-lang-choice]").forEach(function(b){ b.classList.toggle("sel", b.getAttribute("data-lang-choice") === lang); });
  lastHTML = ""; render(); if($("sheet").classList.contains("on")) paintSheet();
}
document.querySelectorAll("[data-i]").forEach(function(n){ n.innerHTML = ico(n.getAttribute("data-i"), n.closest(".mi") ? 19 : 20); n.style.display = "contents"; });

/* ---------- import / export ---------- */
$("exportBtn").addEventListener("click", function(){
  var blob = new Blob([JSON.stringify({app:"routines", version:3, items:items, hist:hist}, null, 2)], {type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "routines-" + iso(today()) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); closeMenus(); setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
});
$("importBtn").addEventListener("click", function(){ closeMenus(); $("file").value = ""; $("file").click(); });
$("file").addEventListener("change", function(){
  var f = this.files && this.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(){
    try{
      var data = JSON.parse(r.result), list = Array.isArray(data) ? data : data.items;
      if(!Array.isArray(list)) throw 0;
      list = list.map(norm).filter(Boolean); if(!list.length) throw 0;
      var before = snap(); items = list; if(data.hist && typeof data.hist === "object") hist = data.hist;
      save(); lastHTML = ""; render(); toast(t("imported", {n:list.length}), before);
    }catch(e){ toast(t("badFile")); buzz([10,50,10]); }
  };
  r.readAsText(f);
});

/* ---------- live: the clock moves, so does the list ---------- */
window.addEventListener("scroll", function(){ $("hdr").classList.toggle("sh", window.pageYOffset > 4); }, {passive:true});
setInterval(function(){ if(!document.hidden && !$("sheet").classList.contains("on")) render(); else $("clock").textContent = hm(nowMin()); }, 20000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden){ lastHTML = ""; render(); maybeCatch(); } });
window.addEventListener("pageshow", function(){ lastHTML = ""; render(); });

applyTheme(); applyLang(); maybeCatch();
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} });
}
})();
</script>
</body></html>
