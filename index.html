<html lang="en">
<head>

<style>
  :root{

  html[data-theme="dark"]{

  *{box-sizing:border-box}

  body{margin:0;font-family:var(--font);font-size:16px;line-height:1.5;color:var(--ink);background:var(--canvas);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;padding-bottom:env(safe-area-inset-bottom,0px)}
  input,textarea{-webkit-user-select:text;user-select:text} button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid var(--yellow-deep);outline-offset:3px}

  .top-status{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,.72);font-size:13px}.status-dot{width:7px;height:7px;border-radius:50%;background:#43d17c;box-shadow:0 0 0 4px rgba(67,209,124,.14)}
  .wrap{width:min(1180px,100%);margin:0 auto;padding:38px 28px 56px}
  .hero{display:flex;align-items:flex-end;justify-content:space-between;gap:28px;margin:0 0 22px;padding:4px 0 0}.hero-text{flex:1;min-width:0}.date{font-size:14px;color:var(--muted);letter-spacing:.02em;margin:0 0 7px;text-transform:capitalize}.hero h1{font-size:clamp(32px,5vw,50px);line-height:1.04;font-weight:760;letter-spacing:-.055em;margin:0}.hero h1 em{font-style:normal;color:var(--red)}.hero-kicker{font-size:15px;color:var(--muted);margin:12px 0 0;max-width:46ch}

  .overview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 32px}.metric{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:16px 17px;box-shadow:var(--shadow);min-width:0}.metric-label{display:block;font-size:12px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.07em}.metric strong{display:block;font-size:25px;line-height:1.15;margin-top:6px;letter-spacing:-.035em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric:first-child strong{color:var(--red)}
  .sec{margin:0 0 25px}.sec-head{display:flex;align-items:center;gap:9px;margin:0 2px 9px}.sec-head h2{font-size:12px;font-weight:750;text-transform:uppercase;letter-spacing:.1em;margin:0;color:var(--muted)}.sec-head .n{font-size:12px;color:var(--faint);background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:1px 6px}.sec.late h2{color:var(--red)}.sec.today h2{color:#a77a00}.list{background:var(--surface);border:1px solid var(--line);border-radius:17px;box-shadow:var(--shadow);overflow:hidden}.row{display:flex;align-items:center;gap:14px;padding:13px 18px 13px 10px;min-height:76px;position:relative;transition:opacity .35s ease,transform .35s var(--ease)}.row + .row::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}.chk{flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px}.chk:hover{background:var(--yellow-soft)}.chk span{width:25px;height:25px;border-radius:8px;border:2px solid var(--faint);display:grid;place-items:center;transition:all .25s var(--ease)}.chk svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .25s var(--ease)}.late .chk span{border-color:var(--red)}.today .chk span{border-color:#c99600}.row.done .chk span{background:var(--green);border-color:var(--green);transform:scale(1.06)}.row.done .chk svg{opacity:1;transform:none}.row.done .ttl{text-decoration:line-through;color:var(--muted)}.row.leaving{opacity:0;transform:translateX(24px)}.body{flex:1;min-width:0;text-align:start}.ttl{font-size:17px;font-weight:650;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{font-size:13px;color:var(--muted);line-height:1.35;margin-top:3px;padding-bottom:4px}.when{flex:none;text-align:end}.pill{display:inline-block;font-size:12px;font-weight:750;padding:5px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}.late .pill{background:var(--red-soft);border-col   .empty{background:var(--surface);border:1px solid var(--line);border-radius:17px;padding:58px 24px;text-align:center;box-shadow:var(--shadow)}.empty-icon{width:52px;height:52px;display:grid;place-items:center;border-radius:16px;background:var(--yellow-soft);margin:0 auto 14px;color:#a77a00}.empty-icon svg{width:25px;height:25px}.empty h3{font-size:22px;margin:0 0 7px;letter-spacing:-.03em}.empty p{color:var(--muted);margin:0 auto 18px;max-width:38ch}.doneline{font-size:14px;color:var(--muted);text-align:center;margin:-5px 0 22px}
  .add{display:flex;justify-content:center;margin:18px 0 30px;z-index:5}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:50px;padding:0 22px;border-radius:12px;background:var(--ink);color:var(--surface);font-size:16px;font-weight:700;box-shadow:0 8px 20px rgba(17,18,20,.16);transition:transform .2s var(--ease),box-shadow .2s var(--ease),background .2s}.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}.btn svg{width:17px;height:17px;flex:none}.btn.yellow{background:var(--yellow);color:#111}.btn.danger{background:var(--red-soft);color:var(--red);box-shadow:none}
  .settings{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin-top:3px}.dropdown{position:relative}.tool-btn{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 13px;border-radius:11px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-size:14px;font-weight:650;transition:border-color .2s,background .2s}.tool-btn:hover,.dropdown.open .tool-btn{border-color:var(--yellow-deep);background:var(--yellow-soft)}.tool-btn > svg:first-child{width:16px;height:16px;color:var(--muted)}.tool-btn .chevron{width:14px;height:14px;color:var(--faint);transition:transform .2s}.dropdown.open .chevron{transform:rotate(180deg)}.menu{position:absolute;left:0;bottom:calc(100% + 8px);min-width:178px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 34px rgba(17,18,20,.16);opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .18s,transform .18s,visibility .18s;z-index:20}.dropdown.open .menu{opacity:1;visibility:visible;transform:none}.menu-item{width:100%;min-height:42px;display:flex;align-items:center;gap:9px;padding:0 10px;border-radius:9px;text-align:start;font-size:14px;font-weight:600}.menu-item:hover{background:var(--yellow-soft)}.menu-item svg{width:16px;height:16px;color:var(--muted)}.menu-item.is-selected{background:var(--yellow-soft);color:#8a6500}.menu-item.is-selected svg{color:#a77a00}.foot{text-align:center;font-size:13px;color:var(--faint);margin-top:20px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;opacity:0;transition:opacity .25s}.scrim.on{opacity:1}.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:24px 24px 0 0;max-width:600px;margin:0 auto;padding:11px 24px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s var(--ease);max-height:92vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.12)}.sheet.on{transform:none}.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 15px}.sheet h3{font-size:23px;letter-spacing:-.03em;margin:0 0 18px}.field{margin-bottom:18px}.field > label{display:block;font-size:12px;font-weight:750;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 8px}.in{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--canvas);color:var(--ink);font:inherit;font-size:17px;padding:0 14px;-webkit-appearance:none;appearance:none}.in:focus{outline:none;border-color:var(--yellow-deep);box-shadow:0 0 0 3px var(--yellow-soft)}input[type=date].in{display:flex;align-items:center}.every{display:flex;gap:8px;align-items:center}.every .in{width:76px;text-align:center;flex:none}.seg{display:flex;flex:1;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}.seg button{flex:1;min-height:42px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}.seg button.on{background:var(--yellow);color:#111;box-shadow:0 1px 3px rgba(0,0,0,.1)}.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{text-align:start;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:44px}.mode b{display:flex;align-items:center;gap:7px;font-size:15px}.mode b svg{width:16px;height:16px;color:var(--muted)}.mode span{display:block;font-size:13px;color:var(--muted);line-height:1.35;margin-top:3px}.mode.on{border-color:var(--yellow-deep);background:var(--yellow-soft)}.mode.on b svg{color:#a77a00}.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}.actions .btn{width:100%;box-shadow:none}.ghostrow{display:flex;gap:8px}.ghost{flex:1;min-height:46px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}.ghost.red{color:var(--red);background:var(--red-soft);border-color:transparent}.ghost svg{width:16px;height:16px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:60;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 10px 10px 15px;display:flex;align-items:center;gap:14px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow-hover);transition:all .3s var(--ease);pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}.toast button{min-height:34px;padding:0 11px;border-radius:8px;font-weight:700;background:rgba(127,127,127,.25);display:inline-flex;align-items:center;gap:6px}.toast button svg{width:15px;height:15px}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.hero,.overview,.sec{animation:up .55s var(--ease) both}.overview{animation-delay:.05s}.sec{animation-delay:.1s}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media(max-width:700px){.topbar-inner{padding:0 18px}.brand-note,.top-status span{display:none}.wrap{padding:28px 16px 45px}.hero{align-items:flex-start;gap:16px}.progress-card{min-width:145px;padding:15px}.progress-line strong{font-size:27px}.progress-track{margin-top:12px}.overview{gap:8px;margin-bottom:25px}.metric{padding:13px 12px}.metric-label{font-size:10px}.metric strong{font-size:21px}.row{padding-right:12px;gap:9px}.when{max-width:92px}.pill{font-size:11px;padding:4px 7px}.bar{left:63px;right:12px}.settings{gap:7px}.tool-btn{padding:0 11px}.sheet{padding-left:18px;padding-right:18px}}@media(max-width:470px){.hero{display:block}.progress-card{margin-top:18px;display:flex;align-items:center;gap:16px}.progress-card-label{flex:1}.progress-line{margin:0;display:block}.progress-line span{display:block;margin-top:4px}.progress-track{flex:1;margin:0}.progress-card .progress-track{width:90px}.overview{grid-template-columns:repeat(3,1fr)}.metric strong{font-size:19px}.ttl{font-size:16px}.sub{font-size:12px}.modes{grid-template-columns:1fr}.menu{bottom:auto;top:calc(100% + 8px)}.settings{justify-content:stretch}.dropdown{flex:1}.tool-btn{width:100%;justify-content:center}}
</style>
<script>
  if("scrollRestoration" in history) history.scrollRestoration = "manual";
  (function(){
    function edge(){
      var full = (screen.height - window.innerHeight) < 40 &&
                 !(window.matchMedia && matchMedia("(display-mode: standalone)").matches);
      document.documentElement.classList.toggle("edge", full);
    }
    function top(){ window.scrollTo(0,0); }
    edge(); top();
    window.addEventListener("resize", edge);
    window.addEventListener("orientationchange", function(){ setTimeout(edge, 200); });
    window.addEventListener("load", function(){ top(); setTimeout(top, 60); });
    window.addEventListener("pageshow", top);
  })();
</script>

<body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><span class="brand-mark">R</span><span>Routines</span><span class="brand-note">personal planner</span></div><div class="top-status"><i class="status-dot"></i><span data-t="offline"></span></div></div></header>
<main class="wrap">
  <header class="hero">
    <div class="hero-text"><p class="date" id="date"></p><h1 id="headline"></h1><p class="hero-kicker" data-t="heroKicker"></p></div>
    <div class="progress-card"><span class="progress-card-label" data-t="todayProgress"></span><div class="progress-line"><strong id="ringTxt"></strong><span data-t="completed"></span></div><div class="progress-track"><i id="ringVal"></i></div></div>
  </header>
  <section class="overview" aria-label="Routine overview"><div class="metric"><span class="metric-label" data-t="dueNow"></span><strong id="metricDue">0</strong></div><div class="metric"><span class="metric-label" data-t="active"></span><strong id="metricActive">0</strong></div><div class="metric"><span class="metric-label" data-t="nextUp"></span><strong id="metricNext">—</strong></div></section>
  <div id="lists"></div>
  <div class="add"><button class="btn yellow" id="addBtn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span data-t="add"></span></button></div>
  <div class="settings">
    <div class="dropdown" data-menu><button class="tool-btn" id="themeBtn" type="button" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span id="themeLabel"></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="menu" role="menu"><button class="menu-item" type="button" data-theme-choice="auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16v11H4z"/><path d="M9 20h6m-3-4v4"/></svg><span data-t="thAuto"></span></button><button class="menu-item" type="button" data-theme-choice="light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><span data-t="thLight"></span></button><button class="menu-item" type="button" data-theme-choice="dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 15.2A8.4 8.4 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg><span data-t="thDark"></span></button></div></div>
    <div class="dropdown" data-menu><button class="tool-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span id="langLabel"></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="menu" role="menu"><button class="menu-item" type="button" data-lang-choice="en"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14M12 5c0 7-3 11-7 14m5-6c2 2 4 3 7 4"/></svg><span>English</span></button><button class="menu-item" type="button" data-lang-choice="fr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14M12 5c0 7-3 11-7 14m5-6c2 2 4 3 7 4"/></svg><span>Français</span></button><button class="menu-item" type="button" data-lang-choice="ar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5h14M12 5c0 7-3 11-7 14m5-6c2 2 4 3 7 4"/></svg><span>العربية</span></button></div></div>
    <div class="dropdown" data-menu><button class="tool-btn" id="dataBtn" type="button" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16v13H4zM8 4h8v3H8z"/><path d="M8 12h8m-8 4h5"/></svg><span data-t="data"></span><svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="menu" role="menu"><button class="menu-item" id="exportBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14"/></svg><span data-t="export"></span></button><button class="menu-item" id="importBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15V3m0 0 4 4m-4-4L8 7M5 21h14"/></svg><span data-t="import"></span></button></div></div>
  </div>
  <p class="foot" data-t="foot"></p><input type="file" id="file" accept="application/json,.json" hidden>
</main>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div><h3 id="sheetTitle"></h3>
  <div class="field"><label for="fName" data-t="fName"></label><input class="in" id="fName" type="text" autocomplete="off" maxlength="60"></div>
  <div class="field"><label data-t="fEvery"></label><div class="every"><input class="in" id="fN" type="number" inputmode="numeric" min="1" max="365" value="1" aria-label="Interval"><div class="seg" id="fUnit"><button type="button" data-u="d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3v4m10-4v4M4 9h16M5 5h14a1 1 0 0 1 1 1v13H4V6a1 1 0 0 1 1-1Z"/></svg></button><button type="button" data-u="w"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M8 3v4m8-4v4M4 9h16"/></svg></button><button type="button" data-u="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></button></div></div></div>
  <div class="field"><label data-t="fMode"></label><div class="modes" id="fMode"><button type="button" class="mode" data-m="fixed"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M8 3v4m8-4v4M4 9h16"/></svg><span data-t="fixed"></span></b><span data-t="fixedSub"></span></button><button type="button" class="mode" data-m="flex"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 5v5h5"/></svg><span data-t="flex"></span></b><span data-t="flexSub"></span></button></div></div>
  <div class="field"><label for="fDate" data-t="fDate"></label><input class="in" id="fDate" type="date"><p class="hint" id="fHint"></p></div>
  <div class="actions"><button class="btn yellow" id="saveBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.5 9.5 17 19 7" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="save"></span></button><div class="ghostrow" id="editRow"><button class="ghost" id="skipBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h13m-5-5 5 5-5 5"/></svg><span data-t="skip"></span></button><button class="ghost red" id="delBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14m-9 4v6m4-6v6M9 7V4h6v3m-9 0 1 14h10l1-14"/></svg><span data-t="del"></span></button></div></div>
</section>
<div class="toast" id="toast" role="status"><span id="toastTxt"></span><button id="undoBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 7 4 12l5 5"/><path d="M5 12h8a6 6 0 0 1 6 6"/></svg><span data-t="undo"></span></button></div>
<script>
(function(){
  "use strict";

  /* ---------- text ---------- */
  var T = {
    add:{en:"Add a routine",fr:"Ajouter une routine",ar:"أضف روتينًا"},
    offline:{en:"Saved locally",fr:"Enregistré localement",ar:"محفوظ محليًا"}, heroKicker:{en:"A clear view of what needs your attention, without the noise.",fr:"Une vue claire de ce qui mérite votre attention, sans bruit.",ar:"نظرة واضحة على ما يحتاج انتباهك، بدون ضوضاء."}, todayProgress:{en:"Today",fr:"Aujourd’hui",ar:"اليوم"}, completed:{en:"completed",fr:"terminé",ar:"مكتمل"}, dueNow:{en:"Due now",fr:"À faire maintenant",ar:"مستحق الآن"}, active:{en:"Active routines",fr:"Routines actives",ar:"الروتينات النشطة"}, nextUp:{en:"Next up",fr:"À venir",ar:"التالي"}, data:{en:"Data",fr:"Données",ar:"البيانات"},
    export:{en:"Export",fr:"Exporter",ar:"تصدير"},
    import:{en:"Import",fr:"Importer",ar:"استيراد"},
    foot:{en:"Saved on this device. Works offline.",fr:"Enregistré sur cet appareil. Fonctionne hors ligne.",ar:"محفوظ على هذا الجهاز. يعمل دون اتصال."},
    late:{en:"Overdue",fr:"En retard",ar:"متأخر"},
    today:{en:"Today",fr:"Aujourd’hui",ar:"اليوم"},
    week:{en:"This week",fr:"Cette semaine",ar:"هذا الأسبوع"},
    later:{en:"Later",fr:"Plus tard",ar:"لاحقًا"},
    tomorrow:{en:"Tomorrow",fr:"Demain",ar:"غدًا"},
    inDays:{en:"in {n} days",fr:"dans {n} jours",ar:"بعد {n} أيام"},
    lateDays:{en:"{n}d late",fr:"{n} j de retard",ar:"متأخر {n} ي"},
    hToday:{en:"<em>{n}</em> to do today",fr:"<em>{n}</em> à faire aujourd’hui",ar:"<em>{n}</em> لليوم"},
    hClear:{en:"All clear today",fr:"Rien pour aujourd’hui",ar:"لا شيء اليوم"},
    hStart:{en:"Your routines",fr:"Vos routines",ar:"روتيناتك"},
    emptyT:{en:"Nothing on repeat yet.",fr:"Aucune routine pour l’instant.",ar:"لا توجد روتينات بعد."},
    emptyP:{en:"Add the things you do again and again — barber, nails, laundry, walking the dog.",fr:"Ajoutez ce que vous refaites sans cesse — coiffeur, ongles, lessive, promener le chien.",ar:"أضف ما تكرره دائمًا — الحلاق، الأظافر، الغسيل، تمشية الكلب."},
    doneToday:{en:"Done today: {n}",fr:"Fait aujourd’hui : {n}",ar:"أُنجز اليوم: {n}"},
    newT:{en:"New routine",fr:"Nouvelle routine",ar:"روتين جديد"},
    editT:{en:"Edit routine",fr:"Modifier",ar:"تعديل"},
    fName:{en:"What",fr:"Quoi",ar:"ماذا"},
    ph:{en:"Go to the barber",fr:"Aller chez le coiffeur",ar:"الذهاب إلى الحلاق"},
    fEvery:{en:"Every",fr:"Tous les",ar:"كل"},
    d:{en:"Days",fr:"Jours",ar:"أيام"},w:{en:"Weeks",fr:"Semaines",ar:"أسابيع"},m:{en:"Months",fr:"Mois",ar:"أشهر"},
    fMode:{en:"Schedule",fr:"Rythme",ar:"الجدولة"},
    fixed:{en:"Fixed date",fr:"Date fixe",ar:"تاريخ ثابت"},
    fixedSub:{en:"Stays on the calendar, like every Sunday",fr:"Reste au calendrier, comme chaque dimanche",ar:"ثابت في التقويم، مثل كل أحد"},
    flex:{en:"No fixed date",fr:"Sans date fixe",ar:"بدون تاريخ ثابت"},
    flexSub:{en:"Counts from the day you do it",fr:"Compte à partir du jour où c’est fait",ar:"يُحسب من يوم إنجازه"},
    fDate:{en:"Next on",fr:"Prochaine fois",ar:"المرة القادمة"},
    hintFixed:{en:"Then every {e} from this date, however late you check it.",fr:"Puis tous les {e} à partir de cette date, même si vous cochez en retard.",ar:"ثم كل {e} من هذا التاريخ، مهما تأخرت."},
    hintFlex:{en:"After you check it, the next one is {e} later.",fr:"Une fois coché, la suivante tombe {e} plus tard.",ar:"بعد إنجازه، يأتي التالي بعد {e}."},
    save:{en:"Save",fr:"Enregistrer",ar:"حفظ"},
    skip:{en:"Skip this one",fr:"Passer cette fois",ar:"تخطَّ هذه المرة"},
    del:{en:"Delete",fr:"Supprimer",ar:"حذف"},
    delQ:{en:"Delete “{n}”?",fr:"Supprimer « {n} » ?",ar:"حذف «{n}»؟"},
    undo:{en:"Undo",fr:"Annuler",ar:"تراجع"},
    nextOn:{en:"Next: {d}",fr:"Prochaine : {d}",ar:"التالي: {d}"},
    removed:{en:"Removed",fr:"Supprimé",ar:"حُذف"},
    skipped:{en:"Skipped to {d}",fr:"Reporté au {d}",ar:"أُجّل إلى {d}"},
    lastDone:{en:"done {x}",fr:"fait {x}",ar:"أُنجز {x}"},
    ago:{en:"{n}d ago",fr:"il y a {n} j",ar:"منذ {n} ي"},
    agoToday:{en:"today",fr:"aujourd’hui",ar:"اليوم"},
    afterDone:{en:"after done",fr:"après coup",ar:"بعد الإنجاز"},
    eDay:{en:"Every day",fr:"Tous les jours",ar:"كل يوم"},
    eWeekOn:{en:"Every {w}",fr:"Chaque {w}",ar:"كل {w}"},
    eMonth:{en:"Every month",fr:"Tous les mois",ar:"كل شهر"},
    eN:{en:"Every {n} {u}",fr:"Tous les {n} {u}",ar:"كل {n} {u}"},
    onDay:{en:"on the {n}",fr:"le {n}",ar:"يوم {n}"},
    ud:{en:"days",fr:"jours",ar:"أيام"},uw:{en:"weeks",fr:"semaines",ar:"أسابيع"},um:{en:"months",fr:"mois",ar:"أشهر"},
    u1d:{en:"day",fr:"jour",ar:"يوم"},u1w:{en:"week",fr:"semaine",ar:"أسبوع"},u1m:{en:"month",fr:"mois",ar:"شهر"},
    thAuto:{en:"Automatic",fr:"Automatique",ar:"تلقائي"},thLight:{en:"Light",fr:"Clair",ar:"فاتح"},thDark:{en:"Dark",fr:"Sombre",ar:"داكن"},
    badFile:{en:"That file could not be read as a Routines export.",fr:"Ce fichier n’est pas un export Routines.",ar:"تعذّرت قراءة هذا الملف."},
    replaceQ:{en:"Replace your routines with this file?",fr:"Remplacer vos routines par ce fichier ?",ar:"استبدال روتيناتك بهذا الملف؟"},
    needName:{en:"Give it a name first.",fr:"Donnez-lui d’abord un nom.",ar:"أعطه اسمًا أولًا."}
  };
  var LANGS = ["en","fr","ar"], LNAME = {en:"English",fr:"Français",ar:"العربية"};
  var lang = get("r.lang") || (navigator.language||"en").slice(0,2);
  if(LANGS.indexOf(lang) < 0) lang = "en";
  function t(k, v){ var s = (T[k] && (T[k][lang] || T[k].en)) || k; if(v) for(var x in v) s = s.split("{"+x+"}").join(v[x]); return s; }

  /* ---------- storage ---------- */
  function get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
  function set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var items = [];
  try{ items = JSON.parse(get("r.items") || "[]"); if(!Array.isArray(items)) items = []; }catch(e){ items = []; }
  function save(){ set("r.items", JSON.stringify(items)); }

  /* ---------- dates (local calendar days, noon to dodge DST) ---------- */
  function today(){ var d = new Date(); d.setHours(12,0,0,0); return d; }
  function iso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
  function parse(s){ var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); return p ? new Date(+p[1], p[2]-1, +p[3], 12) : null; }
  function addDays(d,n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function addMonths(d,n,day){ var x = new Date(d.getFullYear(), d.getMonth()+n, 1, 12);
    var last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate(); x.setDate(Math.min(day||d.getDate(), last)); return x; }
  function diff(a,b){ return Math.round((b - a) / 864e5); }
  function step(it, d, k){ // k intervals from d
    if(it.unit === "m") return addMonths(d, it.n*k, parse(it.anchor) ? parse(it.anchor).getDate() : d.getDate());
    return addDays(d, it.n*k*(it.unit === "w" ? 7 : 1));
  }
  function spanDays(it){ return it.unit === "m" ? it.n*30 : it.n*(it.unit === "w" ? 7 : 1); }
  // Fixed: the first date in the series strictly after `after`.
  function nextFixed(it, after){
    var a = parse(it.anchor), d = a, k = 0;
    while(d <= after && k < 5000){ k++; d = step(it, a, k); }
    return d;
  }
  function fmt(d, opt){ try{ return new Intl.DateTimeFormat(lang === "ar" ? "ar-MA" : lang, opt).format(d); }catch(e){ return iso(d); } }
  function weekStart(d){ var x = new Date(d), wd = (x.getDay()+6)%7; return addDays(x, -wd); }

  /* ---------- describe a schedule ---------- */
  function ord(n){ if(lang !== "en") return lang === "fr" && n === 1 ? "1er" : n;
    var v = n % 100; return n + (v>=11 && v<=13 ? "th" : ["th","st","nd","rd"][n%10] || "th"); }
  function unitWord(it){ return it.n === 1 ? t("u1"+it.unit) : t("u"+it.unit); }
  function describe(it){
    var s, a = parse(it.anchor) || parse(it.next);
    if(it.unit === "d" && it.n === 1) s = t("eDay");
    else if(it.unit === "w" && it.n === 1 && it.mode === "fixed") s = t("eWeekOn", {w: fmt(a,{weekday:"long"})});
    else if(it.unit === "m" && it.n === 1) s = t("eMonth");
    else s = t("eN", {n: it.n, u: unitWord(it)});
    if(it.mode === "fixed" && it.unit === "m") s += " · " + t("onDay", {n: ord(a.getDate())});
    if(it.mode === "fixed" && it.unit === "w" && it.n > 1) s += " · " + fmt(a,{weekday:"short"});
    if(it.mode === "flex") s += " · " + t("afterDone");
    if(it.last){ var g = diff(parse(it.last), today()); s += " · " + t("lastDone", {x: g <= 0 ? t("agoToday") : t("ago",{n:g})}); }
    return s;
  }

  /* ---------- render ---------- */
  var $ = function(id){ return document.getElementById(id); };
  var ICON_CHECK = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.4l3 3 6-6.6" fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

  function render(){
    var now = today(), ws = weekStart(now), we = addDays(ws, 6);
    $("date").textContent = fmt(now, {weekday:"long", day:"numeric", month:"long"});
    var groups = {late:[], today:[], week:[], later:[]};
    items.slice().sort(function(a,b){ return a.next < b.next ? -1 : a.next > b.next ? 1 : a.name.localeCompare(b.name); })
      .forEach(function(it){
        var d = diff(now, parse(it.next));
        var g = d < 0 ? "late" : d === 0 ? "today" : parse(it.next) <= we ? "week" : "later";
        groups[g].push({it:it, d:d});
      });
    var dueNow = groups.late.length + groups.today.length;
    var doneToday = items.filter(function(i){ return i.last === iso(now); }).length;

    $("headline").innerHTML = !items.length ? esc(t("hStart")) : dueNow ? t("hToday", {n: dueNow}) : esc(t("hClear"));
    var total = dueNow + doneToday, frac = total ? doneToday/total : (items.length ? 1 : 0);
    $("ringVal").style.width = (frac * 100).toFixed(1) + "%";
    $("ringTxt").textContent = total ? doneToday + "/" + total : "✓";
    document.querySelector(".progress-card").style.visibility = items.length ? "visible" : "hidden";

    $("metricDue").textContent = dueNow;
    $("metricActive").textContent = items.length;
    var nextItem = items.slice().sort(function(a,b){ return a.next < b.next ? -1 : a.next > b.next ? 1 : 0; })[0];
    $("metricNext").textContent = nextItem ? fmt(parse(nextItem.next), {day:"numeric", month:"short"}) : "—";

    var out = "";
    if(!items.length){
      out = '<div class="empty"><div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1M7.7 15.7l-2.1 2.1"/><circle cx="12" cy="12" r="3.5"/></svg></div><h3>'+esc(t("emptyT"))+'</h3><p>'+esc(t("emptyP"))+'</p></div>';
    } else {
      if(doneToday && !dueNow) out += '<p class="doneline">'+esc(t("doneToday",{n:doneToday}))+'</p>';
      ["late","today","week","later"].forEach(function(g){
        if(!groups[g].length) return;
        out += '<section class="sec '+g+'"><div class="sec-head"><h2>'+esc(t(g))+'</h2><span class="n">'+groups[g].length+'</span></div><div class="list">';
        groups[g].forEach(function(o){
          var it = o.it, nd = parse(it.next), lbl, small = "";
          if(o.d < 0) lbl = t("lateDays",{n:-o.d});
          else if(o.d === 0) lbl = t("today");
          else if(o.d === 1) lbl = t("tomorrow");
          else lbl = t("inDays",{n:o.d});
          if(o.d > 1) small = fmt(nd, o.d < 7 ? {weekday:"long"} : {day:"numeric", month:"short"});
          // how far through its cycle the routine is
          var span = spanDays(it), prog = Math.max(0, Math.min(1, 1 - o.d/span));
          out += '<div class="row" data-id="'+it.id+'">'
            + '<button class="chk" type="button" data-act="done" aria-label="Done: '+esc(it.name)+'"><span>'+ICON_CHECK+'</span></button>'
            + '<button class="body" type="button" data-act="edit"><div class="ttl">'+esc(it.name)+'</div><div class="sub">'+esc(describe(it))+'</div></button>'
            + '<div class="when"><span class="pill">'+esc(lbl)+'</span>'+(small?'<small>'+esc(small)+'</small>':'')+'</div>'
            + '<div class="bar"><i style="width:'+(prog*100).toFixed(1)+'%"></i></div></div>';
        });
        out += '</div></section>';
      });
    }
    $("lists").innerHTML = out;
    document.querySelectorAll("[data-t]").forEach(function(n){ n.textContent = t(n.getAttribute("data-t")); });
    $("fName").placeholder = t("ph");
    document.querySelectorAll("#fUnit button").forEach(function(b){ b.textContent = t(b.getAttribute("data-u")); });
    var th = get("r.theme") || "auto";
    $("themeLabel").textContent = t(th === "light" ? "thLight" : th === "dark" ? "thDark" : "thAuto");
    $("langLabel").textContent = LNAME[lang];
    document.querySelectorAll("[data-theme-choice]").forEach(function(b){ b.classList.toggle("is-selected", b.getAttribute("data-theme-choice") === th); });
    document.querySelectorAll("[data-lang-choice]").forEach(function(b){ b.classList.toggle("is-selected", b.getAttribute("data-lang-choice") === lang); });
  }

  /* ---------- check off ---------- */
  var undoState = null, toastTimer = null;
  function toast(msg, undo){
    undoState = undo || null;
    $("toastTxt").textContent = msg; $("undoBtn").hidden = !undo;
    $("toast").classList.add("on"); clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ $("toast").classList.remove("on"); undoState = null; }, 5000);
  }
  function snapshot(){ return JSON.stringify(items); }
  function complete(id, row){
    var it = find(id); if(!it) return;
    var before = snapshot(), now = today();
    it.last = iso(now);
    if(it.mode === "fixed") it.next = iso(nextFixed(it, parse(it.next) > now ? parse(it.next) : now));
    else it.next = iso(step(it, now, 1));
    save();
    row.classList.add("done");
    if(navigator.vibrate) navigator.vibrate(12);
    setTimeout(function(){ row.classList.add("leaving"); }, 380);
    setTimeout(function(){ render(); toast(t("nextOn",{d: fmt(parse(it.next),{weekday:"short", day:"numeric", month:"short"})}), before); }, 700);
  }
  function find(id){ for(var i=0;i<items.length;i++) if(items[i].id === id) return items[i]; return null; }

  $("lists").addEventListener("click", function(e){
    var b = e.target.closest("[data-act]"); if(!b) return;
    var row = b.closest(".row"), id = row.getAttribute("data-id");
    if(b.getAttribute("data-act") === "done"){ if(!row.classList.contains("done")) complete(id, row); }
    else openSheet(find(id));
  });
  $("undoBtn").addEventListener("click", function(){
    if(!undoState) return; items = JSON.parse(undoState); save(); render();
    $("toast").classList.remove("on"); undoState = null;
  });

  /* ---------- sheet ---------- */
  var editing = null, form = {unit:"w", mode:"flex"};
  function setSeg(){
    document.querySelectorAll("#fUnit button").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-u") === form.unit); });
    document.querySelectorAll("#fMode .mode").forEach(function(b){ b.classList.toggle("on", b.getAttribute("data-m") === form.mode); });
    var n = Math.max(1, parseInt($("fN").value,10) || 1);
    var e = n === 1 ? t("u1"+form.unit) : n + " " + t("u"+form.unit);
    $("fHint").textContent = t(form.mode === "fixed" ? "hintFixed" : "hintFlex", {e:e});
  }
  function openSheet(it){
    editing = it || null;
    $("sheetTitle").textContent = t(it ? "editT" : "newT");
    $("fName").value = it ? it.name : "";
    $("fN").value = it ? it.n : 1;
    form.unit = it ? it.unit : "w"; form.mode = it ? it.mode : "flex";
    $("fDate").value = it ? it.next : iso(today());
    $("editRow").hidden = !it;
    setSeg();
    $("scrim").hidden = false; $("sheet").hidden = false;
    document.documentElement.classList.add("noscroll");
    requestAnimationFrame(function(){ $("scrim").classList.add("on"); $("sheet").classList.add("on"); });
    if(!it) setTimeout(function(){ $("fName").focus(); }, 350);
  }
  function closeSheet(){
    $("scrim").classList.remove("on"); $("sheet").classList.remove("on");
    document.documentElement.classList.remove("noscroll");
    if(document.activeElement) document.activeElement.blur();
    setTimeout(function(){ $("scrim").hidden = true; $("sheet").hidden = true; }, 380);
  }
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && !$("sheet").hidden) closeSheet(); });
  $("fUnit").addEventListener("click", function(e){ var b = e.target.closest("button"); if(b){ form.unit = b.getAttribute("data-u"); setSeg(); } });
  $("fMode").addEventListener("click", function(e){ var b = e.target.closest(".mode"); if(b){ form.mode = b.getAttribute("data-m"); setSeg(); } });
  $("fN").addEventListener("input", setSeg);
  $("fName").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); $("saveBtn").click(); } });

  $("saveBtn").addEventListener("click", function(){
    var name = $("fName").value.trim();
    if(!name){ $("fName").focus(); $("fName").placeholder = t("needName"); return; }
    var n = Math.min(365, Math.max(1, parseInt($("fN").value,10) || 1));
    var d = $("fDate").value && parse($("fDate").value) ? $("fDate").value : iso(today());
    var it = editing || {id: Date.now().toString(36) + Math.random().toString(36).slice(2,6), last:null};
    it.name = name; it.n = n; it.unit = form.unit; it.mode = form.mode; it.next = d; it.anchor = d;
    if(!editing) items.push(it);
    save(); closeSheet(); render();
  });
  $("skipBtn").addEventListener("click", function(){
    if(!editing) return; var before = snapshot(), it = editing;
    it.next = iso(it.mode === "fixed" ? nextFixed(it, parse(it.next)) : step(it, parse(it.next), 1));
    save(); closeSheet(); render();
    toast(t("skipped",{d: fmt(parse(it.next),{day:"numeric", month:"short"})}), before);
  });
  $("delBtn").addEventListener("click", function(){
    if(!editing || !confirm(t("delQ",{n:editing.name}))) return;
    var before = snapshot(), id = editing.id;
    items = items.filter(function(i){ return i.id !== id; });
    save(); closeSheet(); render(); toast(t("removed"), before);
  });
  $("addBtn").addEventListener("click", function(){ openSheet(null); });

  /* ---------- settings ---------- */
  function closeMenus(){ document.querySelectorAll(".dropdown.open").forEach(function(d){ d.classList.remove("open"); var b=d.querySelector(".tool-btn"); if(b) b.setAttribute("aria-expanded","false"); }); }
  document.addEventListener("click", function(e){
    var button = e.target.closest(".tool-btn"), menu = e.target.closest(".dropdown");
    if(button){ e.stopPropagation(); var parent=button.parentNode, was=parent.classList.contains("open"); closeMenus(); if(!was){ parent.classList.add("open"); button.setAttribute("aria-expanded","true"); } return; }
    if(!menu) closeMenus();
  });
  document.querySelectorAll("[data-theme-choice]").forEach(function(b){ b.addEventListener("click", function(){ set("r.theme", b.getAttribute("data-theme-choice")); applyTheme(); closeMenus(); render(); }); });
  document.querySelectorAll("[data-lang-choice]").forEach(function(b){ b.addEventListener("click", function(){ lang = b.getAttribute("data-lang-choice"); set("r.lang", lang); applyLang(); closeMenus(); render(); }); });
  function applyTheme(){
    var th = get("r.theme") || "auto";
    var dark = th === "dark" || (th === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }
  if(window.matchMedia){ var mq = matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener ? mq.addEventListener("change", applyTheme) : mq.addListener(applyTheme)); }
  function applyLang(){ document.documentElement.lang = lang; document.documentElement.dir = lang === "ar" ? "rtl" : "ltr"; }
  $("exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify({app:"routines", version:1, items:items}, null, 2)], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "routines.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); closeMenus();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
  });
  $("importBtn").addEventListener("click", function(){ closeMenus(); $("file").value = ""; $("file").click(); });
  $("file").addEventListener("change", function(){
    var f = this.files && this.files[0]; if(!f) return;
    var r = new FileReader();
    r.onload = function(){
      try{
        var data = JSON.parse(r.result), list = Array.isArray(data) ? data : data.items;
        if(!Array.isArray(list)) throw 0;
        list = list.filter(function(i){ return i && i.name && parse(i.next) && /^[dwm]$/.test(i.unit); }).map(function(i){
          return {id:String(i.id || Math.random().toString(36).slice(2)), name:String(i.name).slice(0,60), n:Math.max(1,+i.n||1), unit:i.unit, mode:i.mode === "fixed" ? "fixed" : "flex", next:i.next, anchor:parse(i.anchor) ? i.anchor : i.next, last:parse(i.last) ? i.last : null};
        });
        if(items.length && !confirm(t("replaceQ"))) return;
        items = list; save(); render();
      }catch(e){ alert(t("badFile")); }
    };
    r.readAsText(f);
  });

  /* Re-render when the day changes while the app stays open. */
  var lastDay = iso(today());
  setInterval(function(){ if(iso(today()) !== lastDay){ lastDay = iso(today()); render(); } }, 60000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && iso(today()) !== lastDay){ lastDay = iso(today()); render(); } });

  applyTheme(); applyLang(); render();

  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    window.addEventListener("load", function(){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} });
  }
})();
</script>
</body>
</html>
