<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Routines</title>
<meta name="description" content="Your day, hour by hour. Check every task.">
<meta name="apple-mobile-web-app-title" content="Routines">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Routines">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="theme-color" id="themeColor" content="#f2f2f7">
<link rel="manifest" href="manifest.json">
<script>
/* no zoom, no double-tap zoom, no pinch — same rules as a native app */
(function(){
  ["gesturestart","gesturechange","gestureend"].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, {passive:false});
  });
  document.addEventListener("dblclick", function(e){ e.preventDefault(); }, {passive:false});
  document.addEventListener("touchmove", function(e){
    if((e.touches && e.touches.length > 1) || (typeof e.scale === "number" && e.scale !== 1)) e.preventDefault();
  }, {passive:false});
  var lastTap = 0;
  document.addEventListener("touchend", function(e){
    var now = Date.now();
    if(now - lastTap <= 320 && !(e.target.closest && e.target.closest("input,textarea"))) e.preventDefault();
    lastTap = now;
  }, {passive:false});
  /* no copy, no selection, no long-press menu (fields excepted) */
  function field(t){ return t && t.closest && t.closest("input,textarea,[contenteditable]"); }
  ["selectstart","contextmenu","dragstart","copy","cut"].forEach(function(ev){
    document.addEventListener(ev, function(e){ if(!field(e.target)) e.preventDefault(); }, {capture:true});
  });
  /* iOS can leave the page scaled or nudged sideways after typing — put it back */
  function unzoom(){
    var m = document.querySelector('meta[name="viewport"]');
    if(m){ var c = m.getAttribute("content"); m.setAttribute("content", c + " "); m.setAttribute("content", c); }
    if(window.pageXOffset) window.scrollTo(0, window.pageYOffset);
  }
  document.addEventListener("focusout", function(){ setTimeout(unzoom, 60); }, true);
  window.addEventListener("orientationchange", function(){ setTimeout(unzoom, 250); });
  document.addEventListener("scroll", function(){ if(window.pageXOffset) window.scrollTo(0, window.pageYOffset); }, {passive:true});
  if("scrollRestoration" in history) history.scrollRestoration = "manual";
})();
</script>
<style>
:root{
  --bg:#fff; --bg2:#f5f5f6; --bg3:#ebebed; --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.2);
  --ink:#000; --ink2:rgba(0,0,0,.58); --ink3:rgba(0,0,0,.36);
  --y:#fc0; --y2:#ffdb4d; --yh:#f5c400; --ysoft:#fff6d1;
  --red:#f33; --redsoft:#ffeceb;
  --menu:#fff; --pop:0 8px 30px rgba(0,0,0,.16),0 0 0 1px rgba(0,0,0,.04);
  --seg:#fff; --segsh:0 1px 3px rgba(0,0,0,.12);
  --font:"YS Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
}
html[data-theme="dark"]{
  --bg:#121212; --bg2:#1f1f1f; --bg3:#2b2b2b; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.24);
  --ink:#fff; --ink2:rgba(255,255,255,.6); --ink3:rgba(255,255,255,.36);
  --ysoft:rgba(255,204,0,.13); --red:#ff5c4d; --redsoft:rgba(255,51,51,.14);
  --menu:#262626; --pop:0 10px 34px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
  --seg:#3a3a3a; --segsh:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;touch-action:manipulation}
html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--bg);overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{color:var(--ink);font:15px/1.35 var(--font);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;min-height:100svh}
input{font:inherit;font-size:16px;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
svg{display:block;flex:none}
.tab{font-variant-numeric:tabular-nums}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:var(--bg);padding:var(--st) var(--sr) 0 var(--sl);transition:box-shadow .2s}
.hdr.sh{box-shadow:0 1px 0 var(--line)}
.hdr-in{max-width:680px;margin:0 auto;height:58px;padding:0 16px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:700;letter-spacing:-.01em;margin-inline-end:auto}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--y);display:grid;place-items:center;color:#000}
.ib{height:40px;min-width:40px;padding:0 10px;border-radius:12px;background:var(--bg2);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;transition:background .15s}
.ib:hover{background:var(--bg3)} .ib:active{transform:scale(.96)}
.ib.pri{background:var(--y);color:#000;padding:0 14px 0 11px}.ib.pri:hover{background:var(--yh)}
.ib .lc{font-size:13px;font-weight:700;text-transform:uppercase}
.dd{position:relative}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;min-width:210px;max-width:calc(100vw - 24px);background:var(--menu);border-radius:14px;box-shadow:var(--pop);padding:6px;z-index:30;opacity:0;transform:translateY(-4px);pointer-events:none;transition:opacity .14s,transform .14s}
.dd.open .menu{opacity:1;transform:none;pointer-events:auto}
.mh{font-size:12px;color:var(--ink3);padding:6px 10px 4px}
.mi{width:100%;height:42px;display:flex;align-items:center;gap:11px;padding:0 10px;border-radius:10px;font-size:15px}
.mi:hover{background:var(--bg2)} .mk{margin-inline-start:auto;opacity:0;display:flex} .mi.sel .mk{opacity:1}
.msep{height:1px;background:var(--line);margin:5px 6px}

/* page */
.wrap{max-width:680px;margin:0 auto;padding:6px calc(16px + var(--sr)) calc(48px + var(--sb)) calc(16px + var(--sl))}
.day{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 12px}
.day h1{font-size:28px;line-height:1.1;font-weight:700;margin:0;letter-spacing:-.02em}
.day p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.clock{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.meter{display:flex;gap:3px;height:6px;margin:0 0 16px}
.meter i{flex:1;border-radius:3px;background:var(--bg3);transition:background .3s}
.meter i.on{background:var(--y)} .meter i.late{background:var(--red)}

/* now card */
.now{background:var(--y);color:#000;border-radius:20px;padding:16px 16px 16px 18px;display:flex;align-items:center;gap:14px;margin:0 0 26px}
.now.calm{background:var(--bg2);color:var(--ink)}
.now-tx{flex:1;min-width:0}
.now-k{font-size:13px;font-weight:500;opacity:.66;display:flex;gap:6px;align-items:center}
.now-k b{background:#000;color:var(--y);font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
.now-n{font-size:22px;font-weight:700;line-height:1.15;margin:3px 0 2px;overflow-wrap:anywhere}
.now-r{font-size:14px;opacity:.75}
.bigck{width:60px;height:60px;border-radius:50%;background:#000;color:var(--y);display:grid;place-items:center;flex:none;transition:transform .15s}
.bigck:active{transform:scale(.92)}
.now.calm .bigck{background:var(--y);color:#000}

/* sections */
.sec{margin:0 0 24px}
.sh2{display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.sh2 h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em}
.sh2 span{color:var(--ink3);font-size:14px}
.sh2 em{font-style:normal;margin-inline-start:auto;color:var(--ink2);font-size:13px}
.sh2 em.red{color:var(--red)}
.box{background:var(--bg2);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 14px;position:relative;transition:opacity .3s,background .2s}
.row+.row::before{content:"";position:absolute;top:0;inset-inline:56px 0;height:1px;background:var(--line)}
.tm{width:46px;flex:none;margin-inline-end:-2px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tm small{display:block;font-size:12px;font-weight:400;color:var(--ink3)}
.row.late .tm{color:var(--red)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:background .2s,border-color .2s,transform .15s;color:#000}
.ck svg{opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.ck:active{transform:scale(.88)}
.row.late .ck{border-color:var(--red)}
.row.done .ck,.ck.on{background:var(--y);border-color:var(--y)}
.row.done .ck svg,.ck.on svg{opacity:1;transform:none}
.bd{flex:1;min-width:0;padding:4px 0}
.nm{font-size:16px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.sb{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.row.done .nm{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--ink3)}
.row.done .sb{color:var(--ink3)}
.tag{flex:none;font-size:12px;font-weight:500;padding:4px 8px;border-radius:8px;background:var(--bg3);color:var(--ink2);white-space:nowrap}
.tag.tnow{background:var(--y);color:#000}.tag.late{background:var(--redsoft);color:var(--red)}
.dots{display:flex;gap:4px;flex:none}.dots i{width:8px;height:8px;border-radius:50%;background:var(--bg3)}.dots i.on{background:var(--y)}
.nowline{display:flex;align-items:center;gap:8px;padding:0 14px 0 25px;height:20px;color:var(--red);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.nowline::after{content:"";flex:1;height:2px;background:var(--red);border-radius:2px}
.row.pop{animation:pop .45s ease}
@keyframes pop{30%{background:var(--ysoft)}}
.more{width:100%;height:48px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:14px;font-weight:500}

/* empty */
.empty{background:var(--bg2);border-radius:20px;padding:26px 20px}
.empty h2{font-size:20px;margin:0 0 6px}.empty p{margin:0 0 16px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:36px;padding:0 13px;border-radius:10px;background:var(--bg);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;box-shadow:inset 0 0 0 1px var(--line)}
.chip:hover{background:var(--bg3)} .chip small{color:var(--ink3);font-size:12px}
.foot{text-align:center;color:var(--ink3);font-size:12px;margin-top:28px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg);border-radius:22px 22px 0 0;max-height:calc(100svh - var(--st) - 24px);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .32s cubic-bezier(.22,1,.36,1);visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet.drag{transition:none}
.sgrab{padding:8px 0 2px;display:grid;place-items:center;flex:none}.sgrab i{width:38px;height:5px;border-radius:3px;background:var(--bg3)}
.shd{display:flex;align-items:center;gap:8px;padding:4px 16px 8px;flex:none}
.shd h3{margin:0;font-size:20px;font-weight:700;margin-inline-end:auto}
.sbody{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 8px;flex:1;-webkit-overflow-scrolling:touch}
.sfoot{flex:none;padding:10px 16px calc(12px + var(--sb));display:flex;gap:8px;border-top:1px solid var(--line)}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:500px;border-radius:22px;max-height:min(760px,calc(100vh - 60px));transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .22s,opacity .18s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1}
  .sgrab{display:none}.shd{padding-top:18px}.sfoot{padding-bottom:16px}
}
.fl{margin:0 0 18px}
.lb{font-size:13px;color:var(--ink2);margin:0 0 7px;display:flex;justify-content:space-between;gap:8px}
.in{width:100%;height:50px;border-radius:12px;border:2px solid transparent;background:var(--bg2);padding:0 14px;outline:none;transition:border-color .15s}
.in:focus{border-color:var(--y);background:var(--bg)}
.sugg{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none;overscroll-behavior-x:contain}
.sugg::-webkit-scrollbar{display:none}
.sugg .chip{flex:none;height:32px;background:var(--bg2);box-shadow:none;font-size:13px}
.kinds{display:grid;gap:6px}
.kind{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;background:var(--bg2);box-shadow:inset 0 0 0 2px transparent;transition:box-shadow .15s,background .15s}
.kind.on{box-shadow:inset 0 0 0 2px var(--y);background:var(--ysoft)}
.kind .ki{width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.kind.on .ki{background:var(--y);color:#000}
.kind b{display:block;font-size:15px;font-weight:700}.kind span{display:block;font-size:13px;color:var(--ink2);margin-top:1px}
.line{display:flex;gap:8px;align-items:center}
.step{display:flex;align-items:center;background:var(--bg2);border-radius:12px;height:44px;flex:none}
.step button{width:44px;height:44px;display:grid;place-items:center;border-radius:12px}.step button:active{background:var(--bg3)}
.step output{min-width:30px;text-align:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;flex:1;height:44px}
.seg button{flex:1;border-radius:9px;font-size:14px;font-weight:500;text-align:center;color:var(--ink2)}
.seg button.on{background:var(--seg);box-shadow:var(--segsh);color:var(--ink)}
.times{display:flex;flex-wrap:wrap;gap:8px}
.tchip{height:40px;padding:0 6px 0 12px;border-radius:11px;background:var(--y);color:#000;display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tchip button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center}.tchip button:hover{background:rgba(0,0,0,.08)}
.tadd{height:40px;padding:0 12px;border-radius:11px;background:var(--bg2);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.picker{margin-top:10px;background:var(--bg2);border-radius:16px;padding:10px;display:none}
.picker.on{display:block}
.wheel{position:relative;display:flex;justify-content:center;align-items:center;gap:4px;height:200px}
.wheel::before{content:"";position:absolute;left:0;right:0;top:80px;height:40px;border-radius:10px;background:var(--bg)}
.col{position:relative;width:76px;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);touch-action:pan-y}
.col::-webkit-scrollbar{display:none}
.col div{height:40px;line-height:40px;text-align:center;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;scroll-snap-align:center}
.col .pad{scroll-snap-align:none;height:80px}
.colon{position:relative;font-size:24px;font-weight:700}
.prow{display:flex;gap:6px;margin-top:10px}
.prow .chip{flex:1;justify-content:center;padding:0 6px;height:34px;font-size:13px}
.dbtn{width:100%;height:50px;border-radius:12px;background:var(--bg2);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:16px;font-weight:500}
.dbtn .chev{margin-inline-start:auto;transition:transform .2s;color:var(--ink3)}.dbtn.open .chev{transform:rotate(180deg)}
.cal{margin-top:8px;background:var(--bg2);border-radius:16px;padding:10px;display:none}.cal.on{display:block}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh b{font-size:15px;text-transform:capitalize}
.calh button{width:36px;height:36px;border-radius:10px;display:grid;place-items:center}.calh button:hover{background:var(--bg3)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg span{font-size:12px;color:var(--ink3);padding:4px 0;text-transform:capitalize}
.calg button{height:40px;border-radius:10px;font-size:15px;font-weight:500;text-align:center;font-variant-numeric:tabular-nums}
.calg button:hover{background:var(--bg3)}
.calg button.td{box-shadow:inset 0 0 0 2px var(--line2)}
.calg button.sel{background:var(--y);color:#000;font-weight:700;box-shadow:none}
.calg button:disabled{color:var(--ink3);opacity:.5;pointer-events:none}
.hint{font-size:13px;color:var(--ink2);margin:10px 2px 0;line-height:1.4}
.btn{height:50px;border-radius:12px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:16px;font-weight:500;background:var(--bg2)}
.btn:active{transform:scale(.98)}
.btn.y{background:var(--y);color:#000;flex:1}.btn.y:hover{background:var(--yh)}
.btn.ic{width:50px;padding:0}
.btn.armed{background:var(--red);color:#fff;width:auto;padding:0 14px}
.toast{position:fixed;left:50%;bottom:calc(18px + var(--sb));z-index:60;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:#1f1f1f;color:#fff;border-radius:14px;padding:6px 6px 6px 14px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:calc(100vw - 24px);transition:opacity .2s,transform .25s}
html[data-theme="dark"] .toast{background:#333}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{height:34px;padding:0 10px;border-radius:9px;color:var(--y);font-weight:700;display:flex;align-items:center;gap:5px;flex:none}
.toast button:hover{background:rgba(255,255,255,.1)}
@media (max-width:420px){.ib.pri .tx{display:none}.ib.pri{padding:0 10px}.day h1{font-size:25px}.clock{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#presets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#presets .chip{flex-direction:column;gap:0;height:48px;padding:0 4px;line-height:1.15;min-width:0}
#presets .chip small{font-size:12px}
.picker .btn:not(.y){background:var(--bg)}
.tgl{background:var(--bg2);border-radius:14px;margin-top:6px}
.tgh{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px}
.tgh .ot{flex:1;min-width:0}
.ot b{display:block;font-size:15px;font-weight:700}
.ot small{display:block;font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.3}
.sw{width:46px;height:28px;border-radius:14px;background:var(--bg3);position:relative;flex:none;transition:background .2s}
.sw i{position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgl.on .sw{background:var(--y)}
.tgl.on .sw i{transform:translateX(18px)} html[dir="rtl"] .tgl.on .sw i{transform:translateX(-18px)}
.optx{display:flex;align-items:center;gap:10px;padding:0 14px 12px}
.optx .step{background:var(--bg)}
.ol{font-size:14px;color:var(--ink2);flex:1}
#fKind .seg{flex:1;min-width:0}
#fKind .seg button{padding:0 2px;white-space:nowrap;font-size:13px}
.sum{flex:none;display:flex;gap:10px;align-items:flex-start;margin:0 16px;padding:12px 14px;border-radius:14px;background:var(--ysoft);font-size:15px;line-height:1.35}
.sum svg{margin-top:1px}
.sum small{display:block;color:var(--ink2);font-size:13px;margin-top:2px}
.empty .btn{margin-top:4px}
.kind.off{opacity:.45}
.kind.off .ki{background:var(--bg3)}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.step button.dim{opacity:.35}
.row.missed .nm{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--red)}
.row.missed .ck{border-color:var(--red);border-style:dashed}
.row.sw-do{background:var(--ysoft)} .row.sw-later{background:var(--bg3)}
.cchip{margin-top:10px;height:32px;padding:0 11px;border-radius:9px;background:#000;color:var(--y);display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700}
.now.calm .cchip{background:var(--ink);color:var(--bg)}
.catch .shd h3{margin-inline-end:0}
.ccount{margin-inline-start:auto;margin-inline-end:6px;color:var(--ink2);font-size:14px}
.cdots{display:flex;gap:4px;padding:0 16px 4px}.cdots i{flex:1;height:4px;border-radius:2px;background:var(--bg3)}.cdots i.on{background:var(--y)}.cdots i.cur{background:var(--ink)}
.cstage{padding:14px 16px 6px;overflow:hidden;min-height:250px;display:flex}
.ccard{flex:1;background:var(--bg2);border-radius:24px;padding:26px 20px 18px;text-align:center;transition:transform .22s,opacity .22s,background .2s;touch-action:pan-y}
.ccard.in{animation:cin .28s ease}
@keyframes cin{from{opacity:0;transform:translateY(14px) scale(.97)}}
.ccard.out-r{transform:translateX(120%) rotate(8deg);opacity:0}.ccard.out-l{transform:translateX(-120%) rotate(-8deg);opacity:0}
.ccard.lean-r{background:var(--ysoft)}.ccard.lean-l{background:var(--bg3)}
.ctime{font-size:46px;font-weight:700;letter-spacing:-.02em;line-height:1;display:flex;justify-content:center;color:var(--ink)}
.cname{font-size:24px;font-weight:700;margin-top:12px;overflow-wrap:anywhere}
.clate{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:8px;background:var(--redsoft);color:var(--red);font-size:13px;font-weight:700}
.csub{color:var(--ink2);font-size:14px;margin-top:10px}
.chint{color:var(--ink3);font-size:12px;margin-top:18px}
.cbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 16px calc(14px + var(--sb))}
.cbtns .btn{font-size:14px;padding:0 8px;gap:6px;height:48px}
.cbtns .cwide{grid-column:1/-1;height:56px;font-size:17px;font-weight:700}
.cbtns .cmiss{color:var(--red)}
.cdone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;animation:cin .3s ease}
.cdone b{font-size:22px}.cdone small{color:var(--ink2);font-size:14px}
.cbig{width:72px;height:72px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;margin-bottom:6px}
.toast #extraBtn{color:#fff;background:rgba(255,255,255,.12)}
.mini{font-size:13px;color:var(--ink3);margin:12px 4px 6px}
.sh2+.mini{margin-top:2px}
.more.later{margin-top:-6px}
.wdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wdays button,.mdays button{height:42px;border-radius:11px;background:var(--bg2);font-size:14px;font-weight:500;text-align:center;text-transform:capitalize}
.wdays button.on,.mdays button.on{background:var(--y);color:#000;font-weight:700}
.sum b{font-weight:700}

/* one column for every check, everywhere */
.nowline::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--red);flex:none;margin-inline-end:14px}
.nowline b{width:46px;flex:none;font-weight:700}
.ap{font-style:normal;font-size:.62em;font-weight:600;margin-inline-start:2px;letter-spacing:0}
.h12 .tm,.h12 .nowline b{width:62px}
.h12 .nowline b{white-space:nowrap}
.clock .ap{font-size:.5em;margin-inline-start:3px}
.mx{margin-inline-start:auto;color:var(--ink3);font-size:13px}
.mx+.mk{margin-inline-start:8px}
.mi>span,.mx{white-space:nowrap}
.h12 .clock{font-size:24px}

.seg.mode{flex:none}
.seg.mode button.off{opacity:.38}
.why{font-size:13px;color:var(--ink3);margin:6px 4px 0}
.mini .none{opacity:.7}
.row{padding-top:10px;padding-bottom:10px}

/* fix: long status pills squeezed the name into one letter per line */
.nm,.sb{overflow-wrap:break-word;word-break:normal}
.row>.tag{flex:0 1 auto;min-width:0;max-width:40%;white-space:normal;text-align:center;line-height:1.25}
.bd .tagin{display:none}
@media (max-width:520px){.row>.tag{display:none}.bd .tagin{display:inline-block;margin-top:6px;max-width:100%}}
.now-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.now-acts .cchip{margin-top:0}
.cchip.ghost{background:rgba(0,0,0,.12);color:#000}.now.calm .cchip.ghost{background:var(--bg3);color:var(--ink)}

/* later sheet */
#lScrim{z-index:54}#later{z-index:55}
.lname{font-size:15px;color:var(--ink2);margin:0 2px 12px}
.lname b{color:var(--ink);font-weight:700}
.lopts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.lopt{min-height:64px;border-radius:14px;background:var(--bg2);padding:10px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:start}
.lopt b{font-size:16px;font-weight:700}.lopt span{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.lopt em{font-style:normal;font-size:12px;color:var(--red);overflow-wrap:break-word}
.lopt.best{background:var(--ysoft);box-shadow:inset 0 0 0 2px var(--y)}
.lopt.wide{grid-column:1/-1}
.lopt:disabled{opacity:.4;pointer-events:none}
.lopt:active{transform:scale(.98)}
#lPicker{margin-top:10px}
#aScrim{z-index:52}#all{z-index:53}
#all .row{min-height:60px}#all .row+.row::before{inset-inline-start:14px}
#all .row.paused .nm{color:var(--ink3)}
#all .row>.tag{display:inline-block;max-width:46%}
.alltasks{margin-top:4px;gap:8px}
.cbulk{grid-column:1/-1;display:flex;gap:8px}
.cbulk button{flex:1;height:38px;border-radius:10px;font-size:13px;font-weight:500;color:var(--ink2);text-align:center;box-shadow:inset 0 0 0 1px var(--line2)}
.cbulk button.r{color:var(--red)}

/* ================= Design system v2 — calm, trustworthy, native =================
   Blue = action & trust · Green = done (reward) · Orange = late (attention, not alarm)
   Red = only for missed / destructive · Neutral greys carry everything else.          */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Arabic",sans-serif;
  --bg:#f2f2f7; --bg2:#ffffff; --bg3:#e5e5ea; --line:rgba(60,60,67,.14); --line2:rgba(60,60,67,.29);
  --ink:#000; --ink2:rgba(60,60,67,.62); --ink3:rgba(60,60,67,.34);
  --y:#007aff; --yh:#0062cc; --ysoft:rgba(0,122,255,.09); --on:#fff;
  --ok:#34c759; --oksoft:rgba(52,199,89,.13);
  --late:#e8590c; --latesoft:rgba(255,149,0,.13);
  --red:#ff3b30; --redsoft:rgba(255,59,48,.10);
  --menu:#fff; --seg:#fff; --card-sh:0 1px 2px rgba(0,0,0,.04);
}
html[data-theme="dark"]{
  --bg:#000; --bg2:#1c1c1e; --bg3:#2c2c2e; --line:rgba(84,84,88,.5); --line2:rgba(235,235,245,.3);
  --ink:#fff; --ink2:rgba(235,235,245,.62); --ink3:rgba(235,235,245,.32);
  --y:#0a84ff; --yh:#3395ff; --ysoft:rgba(10,132,255,.16);
  --ok:#30d158; --oksoft:rgba(48,209,88,.16);
  --late:#ff9f0a; --latesoft:rgba(255,159,10,.15);
  --red:#ff453a; --redsoft:rgba(255,69,58,.15);
  --menu:#2c2c2e; --seg:#636366; --card-sh:none;
}
html[data-theme="dark"] .sheet{background:#1c1c1e}
html[data-theme="dark"] .sheet .in,html[data-theme="dark"] .sheet .kind,html[data-theme="dark"] .sheet .seg,html[data-theme="dark"] .sheet .step,
html[data-theme="dark"] .sheet .tgl,html[data-theme="dark"] .sheet .tadd,html[data-theme="dark"] .sheet .picker,html[data-theme="dark"] .sheet .wdays button,
html[data-theme="dark"] .sheet .mdays button,html[data-theme="dark"] .sheet .btn:not(.y):not(.armed),html[data-theme="dark"] .sheet .lopt,
html[data-theme="dark"] .sheet .box,html[data-theme="dark"] .sheet .ccard{background:#2c2c2e}
html[data-theme="dark"] .sheet .wheel::before{background:#3a3a3c}

.logo{font-size:17px;font-weight:600;letter-spacing:-.02em}

/* hero */
.now,.now.calm{background:var(--bg2);color:var(--ink);border-radius:18px;padding:16px 16px 16px 18px;box-shadow:var(--card-sh);position:relative;overflow:hidden}
.now::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--y)}

.bigck{width:54px;height:54px;background:var(--ok);color:#fff;box-shadow:0 4px 14px rgba(52,199,89,.32)}
.now.calm .bigck{background:var(--y);color:#fff;box-shadow:0 4px 14px rgba(0,122,255,.28)}
.cchip{background:var(--ysoft);color:var(--y);font-weight:600;border-radius:10px;height:34px}
.cchip.ghost,.now.calm .cchip.ghost{background:var(--bg3);color:var(--ink)}
.now.calm .cchip{background:var(--ysoft);color:var(--y)}

/* sections & rows */
.sh2 h2{font-size:21px;font-weight:700;letter-spacing:-.02em}
.sh2 span{font-weight:500}
.sh2 em{font-weight:500}.sh2 em.red{color:var(--late)}
.mini{font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);margin:12px 16px 6px}
.box{border-radius:14px;box-shadow:var(--card-sh)}
.nm{font-size:17px;font-weight:400;letter-spacing:-.015em}
.sb{font-size:14px}
.tm{font-weight:600}
.ck{width:28px;height:28px;border:1.75px solid var(--line2);color:#fff}
.row.late .ck{border-color:var(--late)} .row.late .tm{color:var(--late)}
.row.done .ck,.ck.on{background:var(--ok);border-color:var(--ok)}
.row.done .nm{text-decoration-color:var(--ink3)}
.row.missed .ck{border-color:var(--red)} .row.missed .nm{text-decoration-color:var(--red)}
.row.pop{animation:pop2 .5s ease}
@keyframes pop2{30%{background:var(--oksoft)}}
.ck.on{animation:ckpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes ckpop{40%{transform:scale(1.18)}}
.tag{font-weight:500;border-radius:7px;background:var(--bg3);color:var(--ink2)}
.tag.tnow{background:var(--y);color:#fff}
.tag.late{background:var(--latesoft);color:var(--late)}
.row.missed .tag.late{background:var(--redsoft);color:var(--red)}
.dots i{background:var(--bg3)}.dots i.on{background:var(--ok)}
.nowline{color:var(--red)}
.more{color:var(--y);font-weight:500}
.row.sw-do{background:var(--oksoft)}

/* controls */
.btn{font-weight:600;border-radius:13px}
.btn.y,.tchip,.kind.on .ki,.calg button.sel,.wdays button.on,.mdays button.on{background:var(--y);color:#fff}
.btn.y:hover{background:var(--yh)}
.in{border-radius:12px}
.tgl.on .sw{background:var(--ok)}
.seg button.on{font-weight:600}
.sum{background:var(--ysoft);color:var(--ink)}
.sum svg{color:var(--y)}
.lopt.best{background:var(--ysoft);box-shadow:inset 0 0 0 1.5px var(--y)}
.lopt em{color:var(--late)}
.toast{background:rgba(28,28,30,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:14px}

.cdots i.on{background:var(--ok)}
.ccard.lean-r{background:var(--oksoft)}
.clate{background:var(--latesoft);color:var(--late)}
.cbig{background:var(--ok);color:#fff}
.cbtns .cmiss{color:var(--red)}
.empty{border-radius:18px;box-shadow:var(--card-sh)}
.day h1{font-size:clamp(23px,6.6vw,30px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day>div:first-child{min-width:0}
</style>

/* The clock can lie (manual change, travel, dead battery). Every saved state is stamped;
   if time ever runs backwards we go back to the last state that existed at that time. */
function snaps(){ try{ var a = JSON.parse(get("r.snaps") || "[]"); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
function pushSnap(j){
  var a = snaps(), now = Date.now();
  if(a.length && a[a.length-1].s === j) return;
  a.push({ts:now, s:j});
  /* never prune by age: "now" may be fake. Keep the last 30 states + the last state of each of 14 days */
  if(a.length > 30){
    var last = {}; a.forEach(function(x, k){ last[iso(new Date(x.ts))] = k; });
    var keepK = Object.keys(last).sort().slice(-14).map(function(d){ return last[d]; }), n = a.length;

}

/* A task can be at most ~2 repeats ahead of today (done today + one skip). Anything further
   can only come from a clock that was set forward — put it back on today's schedule. */
function repairFuture(){
  var td = today(), T0 = iso(td), n = 0;
  items.forEach(function(it){
    var bad = false;
    if(it.last && it.last > T0){ it.last = null; bad = true; }
    var l = it.log.length; it.log = it.log.filter(function(d){ return d <= T0; }); if(l !== it.log.length) bad = true;
    if(it.slots && it.slots.date > T0){ it.slots = null; bad = true; }
    if(it.prev && it.prev.date > T0) it.prev = null;
    if(it.kind !== "window" && !it.paused){
      var nx = parse(it.next), lim;
      if(it.unit === "h") lim = addDays(td, 1);
      else { var a = it.kind === "fixed" && !it.shift ? nextFixed(it, td) : step(it, td, 1); lim = step(it, a, 1); }
      if(nx > lim){
        if(it.unit === "h"){ var nw = new Date(); nw.setSeconds(0, 0); setOcc(it, nw); if(it.shift || it.kind === "flex"){ it.anchor = it.next; it.at0 = it.times[0]; } }
        else it.next = iso(it.kind === "fixed" && !it.shift ? firstOnOrAfter(it, td) : td);
        if(it.shift && it.unit !== "h") it.anchor = it.next;

  if(hk.length){ hk.forEach(function(k){ delete hist[k]; }); set("r.hist", JSON.stringify(hist)); }

function guardClock(){
  var now = Date.now(), seen = +get("r.seen") || 0;
  if(seen && now < seen - 5*60e3){
    var a = snaps(), pick = null, T0 = iso(today());
    for(var i = a.length - 1; i >= 0; i--) if(a[i].ts <= now){ pick = a[i]; break; }
    var before = JSON.stringify(items);
    if(pick){ try{ items = JSON.parse(pick.s).map(norm).filter(Boolean); }catch(e){} }
    items.forEach(function(it){                     /* nothing can have happened after "now" */
      if(it.last && it.last > T0) it.last = null;
      it.log = it.log.filter(function(d){ return d <= T0; });
      if(it.slots && it.slots.date > T0) it.slots = null;
      if(it.prev && it.prev.date > T0) it.prev = null;
    });
    Object.keys(hist).forEach(function(k){ if(k > T0) delete hist[k]; });
    set("r.hist", JSON.stringify(hist));
    set("r.snaps", JSON.stringify(a.filter(function(x){ return x.ts <= now; })));
    if((+get("r.catchAt") || 0) > now) set("r.catchAt", "0");
    set("r.items", JSON.stringify(items));
    warped = before;
  }
  repairFuture();
  if(!warped) pushSnap(JSON.stringify(items));   /* baseline: the state as it is right now */
  set("r.seen", String(now));
}

function today(){ var d = new Date(); d.setHours(12,0,0,0); return d; }
function iso(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function parse(s){ var p = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ""); return p ? new Date(+p[1], p[2]-1, +p[3], 12) : null; }
function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
function addMonths(d, n, day){ var x = new Date(d.getFullYear(), d.getMonth()+n, 1, 12); var last = new Date(x.getFullYear(), x.getMonth()+1, 0).getDate(); x.setDate(Math.min(day || d.getDate(), last)); return x; }

function hm(m){ return ("0"+Math.floor(m/60)).slice(-2)+":"+("0"+(m%60)).slice(-2); }
/* display only: data always stays HH:MM */
function h12(){ return get("r.clock") === "12"; }
function ap(h){ return lang === "ar" ? (h < 12 ? "ص" : "م") : (h < 12 ? "AM" : "PM"); }
function ft(x){ var m = typeof x === "number" ? x : mins(x); if(m === null || m === undefined) return x || ""; if(!h12()) return hm(m); var h = Math.floor(m/60); return ((h % 12) || 12)+":"+("0"+(m%60)).slice(-2)+" "+ap(h); }

function mins(s){ var p = /^(\d{1,2}):(\d{2})$/.exec(s || ""); return p ? (+p[1])*60 + (+p[2]) : null; }

function period(p, d){ if(p === "d") return [d, d]; if(p === "m") return [new Date(d.getFullYear(), d.getMonth(), 1, 12), new Date(d.getFullYear(), d.getMonth()+1, 0, 12)]; var w = weekStart(d); return [w, addDays(w, 6)]; }

/* ---------- normalise (old exports still load) ---------- */
function norm(i){
  if(!i || !i.name) return null;
  var it = {id:String(i.id || uid()), name:String(i.name).slice(0,120)};
  it.kind = i.kind === "window" || i.kind === "fixed" || i.kind === "flex" ? i.kind : (i.mode === "fixed" ? "fixed" : "flex");
  it.n = Math.min(365, Math.max(1, +i.n || 1)); it.unit = /^[hdwm]$/.test(i.unit) ? i.unit : "w"; it.shift = !!i.shift;
  it.quota = Math.min(31, Math.max(1, +i.quota || 1)); it.period = i.period === "m" || i.period === "d" ? i.period : "w";
  var tm = (Array.isArray(i.times) ? i.times : []).filter(function(x){ return mins(x) !== null; }).map(function(x){ return hm(mins(x)); });
  it.times = tm.filter(function(x, k){ return tm.indexOf(x) === k; }).sort();
  it.next = parse(i.next) ? i.next : iso(today()); it.anchor = parse(i.anchor) ? i.anchor : it.next;
  it.last = parse(i.last) ? i.last : null;
  it.slots = i.slots && i.slots.date ? {date:i.slots.date, done:i.slots.done || {}, snz:i.slots.snz || {}} : null;
  it.log = Array.isArray(i.log) ? i.log.filter(parse) : [];
  it.prev = i.prev || null; it.paused = !!i.paused;
  if(it.kind === "window") it.times = [];
  if(it.unit === "h"){ if(it.kind === "window") it.kind = "flex"; if(!it.times.length){ var _n = new Date(); it.times = [hm(_n.getHours()*60 + _n.getMinutes())]; } it.times = [it.times[0]]; it.n = Math.min(23, it.n); }
  it.at0 = mins(i.at0) !== null ? hm(mins(i.at0)) : (it.times[0] || null);
  return it;
}
items = items.map(norm).filter(Boolean);

/* timed tasks belong to the clock: missed hours roll to today instead of piling up */
function roll(){
  var td = today(), T0 = iso(td), ch = false, cut = iso(addDays(td, -70));
  items.forEach(function(it){
    if(it.paused) return;
    if(it.unit === "h"){
      var occ = dt(it.next, it.times[0]), now = new Date();
      if(it.kind === "fixed" && !it.shift){ var L = gridLE(it, now); if(occ < L){ setOcc(it, L); ch = true; } }
      else if(parse(it.next) < td){ setOcc(it, dt(T0, it.times[0])); ch = true; }
    }
    else if(it.kind !== "window" && it.times.length && parse(it.next) < td){ it.next = iso(it.kind === "fixed" ? firstOnOrAfter(it, td) : td); ch = true; }
    if(it.slots && it.slots.date < T0){ it.slots = null; ch = true; }
    var l = it.log.length; it.log = it.log.filter(function(d){ return d >= cut; }); if(l !== it.log.length) ch = true;
  });
  if(ch) save();
}

/* ---------- model ---------- */
function model(){
  var td = today(), T0 = iso(td), nm = nowMin();
  var m = {overdue:[], slots:[], any:[], dayWin:[], week:[], month:[], coming:[], done:0, total:0, pending:0, ontime:0};
  function slot(it, tm, sd, snz, forceDone){
    var v = sd[tm], eff = (snz && snz[tm]) || tm, mm = mins(eff);
    var s = {it:it, time:tm, eff:eff, snoozed:eff !== tm, min:mm, delta:mm - nm, at:null, done:false, missed:false};
    if(v === "×"){ s.missed = true; s.state = "missed"; }
    else if(v || forceDone){ s.done = true; s.at = v || null; s.state = "done"; if(!v || mins(v) <= mins(tm) + 30) m.ontime++; }
    else s.state = s.delta < -30 ? "late" : s.delta <= 0 ? "now" : "soon";
    m.slots.push(s); m.total++;
    if(s.done) m.done++; else if(s.state === "late" || s.state === "now") m.pending++;
  }
  items.forEach(function(it){
    if(it.paused) return;
    if(it.kind === "window"){
      var pr = period(it.period, td), a = iso(pr[0]), b = iso(pr[1]);
      var c = it.log.filter(function(d){ return d >= a && d <= b; }).length;
      var o = {it:it, count:c, today:it.log.indexOf(T0) > -1, left:diff(td, pr[1])};
      o.met = c >= it.quota;
      if(it.period === "d"){ m.dayWin.push(o); m.total += it.quota; m.done += Math.min(c, it.quota); if(!o.met) m.pending++; }
      else (it.period === "m" ? m.month : m.week).push(o);
      return;
    }
    var on = it.slots && it.slots.date === T0, sd = on ? it.slots.done : {}, snz = on ? it.slots.snz : null;
    if(it.unit === "h"){
      var dh = diff(td, parse(it.next));
      Object.keys(sd).forEach(function(tm){ if(!(dh === 0 && tm === it.times[0])) slot(it, tm, sd, null, false); });
      if(dh === 0) slot(it, it.times[0], sd, null, false);
      else if(dh > 0) m.coming.push({it:it, d:dh});
      return;
    }
    var d = diff(td, parse(it.next)), doneToday = it.last === T0;
    if(it.times.length && (d === 0 || doneToday || (on && it.times.every(function(x){ return sd[x]; })))){
      it.times.forEach(function(tm){ slot(it, tm, sd, snz, doneToday && d !== 0); });
      if(d > 0) m.coming.push({it:it, d:d});
      return;
    }
    if(d < 0){ m.overdue.push({it:it, d:d}); m.total++; m.pending++; return; }
    if(d === 0){ m.any.push({it:it, done:false}); m.total++; m.pending++; return; }
    if(doneToday){ m.any.push({it:it, done:true}); m.total++; m.done++; }
    m.coming.push({it:it, d:d});
  });
  m.slots.sort(function(a, b){ return a.min - b.min || a.it.name.localeCompare(b.it.name); });
  m.coming.sort(function(a, b){ return a.d - b.d || (a.it.times[0] || "99").localeCompare(b.it.times[0] || "99"); });
  m.overdue.sort(function(a, b){ return a.d - b.d; });
  m.any.sort(function(a, b){ return a.done - b.done; });
  function ws(a, b){ return a.met - b.met || (b.it.quota - b.count) - (a.it.quota - a.count); }
  m.week.sort(ws); m.month.sort(ws); m.dayWin.sort(ws);
  return m;
}

/* ---------- describe ---------- */
function ord(n){ if(lang !== "en") return lang === "fr" && n === 1 ? "1er" : n; var v = n % 100; return n + (v >= 11 && v <= 13 ? "th" : ["th","st","nd","rd"][n % 10] || "th"); }
function every(it){ return it.n === 1 ? t("u1"+it.unit) : it.n + " " + t("u"+it.unit); }
function qtxt(q){ return q === 1 ? t("once") : t("timesN", {n:q}); }

  if(it.kind === "window"){ var sp = t("some" + it.period); return it.quota > 1 ? t("timesN", {n:it.quota}) + " · " + sp.charAt(0).toLowerCase() + sp.slice(1) : sp; }
  var s, a = parse(it.anchor) || parse(it.next);
  if(it.unit === "h") return (it.n === 1 ? t("eHour") : t("eN", {n:it.n, u:t("uh")})) + (it.kind === "flex" || it.shift ? " · " + t("afterDone") : "");
  if(it.unit === "d" && it.n === 1) s = t("eDay");
  else if(it.unit === "w" && it.n === 1 && it.kind === "fixed") s = t("eWeekOn", {w:fmt(a, {weekday:"long"})});
  else if(it.unit === "m" && it.n === 1) s = t("eMonth");
  else s = it.n === 1 ? t("eOne", {u:t("u1"+it.unit)}) : t("eN", {n:it.n, u:t("u"+it.unit)});
  if(it.kind === "fixed" && it.unit === "m") s += " · " + t("onDay", {n:ord(a.getDate())});
  if(it.kind === "flex" || it.shift) s += " · " + t("afterDone");
  if(it.last && !it.times.length){ var g = diff(parse(it.last), today()); s += " · " + t("lastDone", {x: g <= 0 ? t("agoToday") : t("ago", {n:g})}); }
  return s;
}
function rel(s){ if(s.state === "missed") return t("missedTag"); return s.state === "done" ? (s.at ? t("doneAt", {t:ft(s.at)}) : "") : s.state === "now" ? t("nowTag") : s.state === "late" ? t("lateX", {x:dur(s.delta)}) : t("inX", {x:dur(s.delta)}); }

/* ---------- render ---------- */
var expanded = false, lastHTML = "";
function row(cls, act, id, extra, left, name, sub, right, ckOn){
  var tin = /^<span class="tag/.test(right || "") ? '<div>' + right.replace('class="tag', 'class="tagin tag') + '</div>' : "";
  return '<div class="row '+cls+'" data-id="'+id+'"'+extra+'>'+
    '<button class="ck'+(ckOn ? " on" : "")+'" type="button" data-act="'+act+'" aria-label="'+esc(name)+'">'+TICK+'</button>'+left+
    '<button class="bd" type="button" data-act="edit"><div class="nm">'+esc(name)+'</div>'+(sub ? '<div class="sb">'+esc(sub)+'</div>' : '')+tin+'</button>'+right+'</div>';
}
function sec(title, count, right, body){
  return '<section class="sec"><div class="sh2"><h2>'+esc(title)+'</h2>'+(count ? '<span>'+count+'</span>' : '')+(right || "")+'</div><div class="box">'+body+'</div></section>';
}
function winRow(o){
  var dots = "";
  if(o.it.quota <= 7){ for(var i = 0; i < o.it.quota; i++) dots += '<i class="'+(i < o.count ? "on" : "")+'"></i>'; dots = '<div class="dots">'+dots+'</div>'; }
  else dots = '<span class="tag tab">'+o.count+'/'+o.it.quota+'</span>';
  var sub = o.met ? t("goalDone", {p:t("p"+o.it.period)}) : describe(o.it) + (o.count ? " · " + o.count + "/" + o.it.quota : "");
  return row(o.met ? "done" : "", "win", o.it.id, "", "", o.it.name, sub, dots, o.today);
}
function sec3(title, count, right, fixed, free){
  if(!fixed && !free) return "";
  function mini(k, body){ return body ? '<div class="mini">'+esc(t(k))+'</div><div class="box">'+body+'</div>' : ''; }
  return '<section class="sec"><div class="sh2"><h2>'+esc(title)+'</h2>'+(count ? '<span>'+count+'</span>' : '')+(right || "")+'</div>'+
    mini("fixedD", fixed) + mini("flexD", free) + '</section>';
}
function left(l, list){ var open = list.filter(function(o){ return !o.met; }).length; if(l === 0) return '<em class="tab'+(open ? " red" : "")+'">'+esc(t("leftX", {x:dur(1440 - nowMin())}))+'</em>'; return '<em class="'+(l <= 1 && open ? "red" : "")+'">'+esc(l === 0 ? t("lastDay") : t("daysLeft", {n:l + 1}))+'</em>'; }
function render(){
  guardClock(); roll();
  var td = today(), m = model(), nm = nowMin(), out = "";
  $("dayName").textContent = fmt(td, {weekday:"long", day:"numeric", month:"long"});
  $("clock").innerHTML = ftH(nm);
  if(m.total) hist[iso(td)] = [m.done, m.total];
  var streak = 0, k = 1, dd;
  while(k < 400){ dd = hist[iso(addDays(td, -k))]; if(!dd) break; if(dd[1] && dd[0] >= dd[1]) streak++; else if(dd[1]) break; k++; }
  if(m.total && m.done >= m.total) streak++;
  var hk = Object.keys(hist).sort(); while(hk.length > 120) delete hist[hk.shift()];
  set("r.hist", JSON.stringify(hist));
  $("dayMeta").textContent = m.total ? t("ofDone", {a:m.done, b:m.total}) + (m.ontime ? " · " + t("ontimeN", {n:m.ontime}) : "") + (streak > 1 ? " · " + t("streak", {n:streak}) : "") : (items.length ? t("noTasks") : "");
  var seg = [];
  m.overdue.forEach(function(){ seg.push("late"); });
  m.slots.forEach(function(s){ seg.push(s.done ? "on" : s.state === "late" || s.state === "missed" ? "late" : ""); });
  m.dayWin.forEach(function(o){ for(var q = 0; q < o.it.quota; q++) seg.push(q < o.count ? "on" : ""); });
  m.any.forEach(function(a){ seg.push(a.done ? "on" : ""); });
  $("meter").innerHTML = seg.slice(0, 40).map(function(c){ return '<i class="'+c+'"></i>'; }).join("");
  $("meter").style.display = seg.length ? "" : "none";

  if(!items.length){
    out = '<div class="empty"><h2>'+esc(t("emptyT"))+'</h2><p>'+esc(t("emptyP"))+'</p><button class="btn y" type="button" data-act="add">'+ico("plus")+esc(t("addFirst"))+'</button></div>';
  } else {
    out += nowCard(m);
    var we = iso(addDays(weekStart(td), 6)), me = iso(new Date(td.getFullYear(), td.getMonth()+1, 0, 12));
    var cw = [], cm = [], cl = [];
    m.coming.forEach(function(c){ if(c.it.unit === "h" || (c.it.unit === "d" && c.it.n === 1)) return; (c.it.next <= we ? cw : c.it.next <= me ? cm : cl).push(c); });
    function comingRow(c, long){
      var nd = parse(c.it.next), lbl = c.d === 1 ? t("tomorrow") : fmt(nd, long ? {day:"numeric", month:"short"} : {weekday:"short"});
      if(c.it.times.length) lbl += " · " + ft(c.it.times[0]) + (c.it.times.length > 1 ? " +" + (c.it.times.length - 1) : "");
      return row("", "item", c.it.id, "", "", c.it.name, describe(c.it), '<span class="tag">'+esc(lbl)+'</span>');
    }
    // TODAY · fixed
    var fx = "";
    var gap = m.slots.length ? '<div class="tm"></div>' : "";
    m.overdue.forEach(function(o){ fx += row("late", "item", o.it.id, "", gap, o.it.name, describe(o.it), '<span class="tag late">'+esc(t("lateD", {n:-o.d}))+'</span>'); });
    if(m.slots.length){
      var placed = false;
      m.slots.forEach(function(s){
        if(!placed && s.min > nm){ placed = true; fx += '<div class="nowline"><b>'+ft(nm)+'</b></div>'; }
        var r = rel(s), tag = r ? '<span class="tag '+(s.state === "now" ? "tnow" : s.state === "late" || s.state === "missed" ? "late" : "")+'">'+esc(r)+'</span>' : '';
        fx += row("timed " + (s.state === "now" ? "due" : s.state), "slot", s.it.id, ' data-time="'+s.time+'"', '<div class="tm">'+ftH(s.eff)+(s.snoozed ? '<small>'+ft(s.time)+'</small>' : '')+'</div>', s.it.name, (s.snoozed && !s.done && !s.missed ? t("movedFrom", {t:ft(s.time)}) + " · " : "") + describe(s.it), tag);
      });
      if(!placed) fx += '<div class="nowline"><b>'+ft(nm)+'</b></div>';
    }
    m.any.forEach(function(a){ fx += row(a.done ? "done" : "", "item", a.it.id, "", gap, a.it.name, describe(a.it), ""); });
    var todayLeft = m.overdue.length + m.slots.filter(function(s){ return !s.done && !s.missed; }).length + m.any.filter(function(a){ return !a.done; }).length + m.dayWin.filter(function(o){ return !o.met; }).length;
    var tl = 1440 - nm, dueLeft = todayLeft > 0;
    out += sec3(t("schedule"), todayLeft, '<em class="tab'+(tl <= 120 && dueLeft ? " red" : "")+'">'+esc(t("leftX", {x:dur(tl)}))+'</em>', fx, m.dayWin.map(winRow).join(""));
    // THIS WEEK / THIS MONTH
    var wl = diff(td, parse(we)), ml = diff(td, parse(me));
    out += sec3(t("week"), cw.length + m.week.filter(function(o){ return !o.met; }).length, left(wl, m.week), cw.map(function(c){ return comingRow(c, false); }).join(""), m.week.map(winRow).join(""));
    out += sec3(t("month"), cm.length + m.month.filter(function(o){ return !o.met; }).length, left(ml, m.month), cm.map(function(c){ return comingRow(c, true); }).join(""), m.month.map(winRow).join(""));
    if(cl.length){
      out += '<button class="more later" type="button" data-act="more">'+esc(t("laterN", {n:cl.length}))+'<span style="display:contents">'+ico("chev", 16).replace("<svg", expanded ? '<svg style="transform:rotate(180deg)"' : "<svg")+'</span></button>';
      if(expanded) out += '<div class="box">'+cl.map(function(c){ return comingRow(c, true); }).join("")+'</div>';
    }
    var np = items.filter(function(i){ return i.paused; }).length;
    out += '<button class="more alltasks" type="button" data-act="all">'+ico("dots", 16)+esc(t("allT"))+' · '+items.length+(np ? ' · '+esc(t("pausedN", {n:np})) : '')+'</button>';
  }
  if(out !== lastHTML){ $("app").innerHTML = out; lastHTML = out; }
  if(warped){ var wb = warped; warped = null; repaired = 0; setTimeout(function(){ toast(t("clockBack"), wb); }, 300); }
  else if(repaired){ var rn = repaired; repaired = 0; setTimeout(function(){ toast(t("repairedN", {n:rn})); }, 300); }
  $("allCount").textContent = items.length || "";
  document.title = (m.pending ? "(" + m.pending + ") " : "") + "Routines";
  try{ if(navigator.setAppBadge){ if(m.pending) navigator.setAppBadge(m.pending); else navigator.clearAppBadge(); } }catch(e){}
}
function nowCard(m){
  var s = null, kind = "";
  var late = m.slots.filter(function(x){ return x.state === "late"; }), cur = m.slots.filter(function(x){ return x.state === "now"; }), soon = m.slots.filter(function(x){ return x.state === "soon"; });
  var anyOpen = m.any.filter(function(a){ return !a.done; });
  if(cur.length){ s = cur[0]; kind = "kNow"; }
  else if(soon.length && soon[0].delta <= 15){ s = soon[0]; kind = "kNext"; }
  else if(late.length){ s = late[late.length - 1]; kind = "kLate"; }
  else if(m.overdue.length){ s = {it:m.overdue[0].it, over:m.overdue[0].d}; kind = "kLate"; }
  else if(soon.length){ s = soon[0]; kind = "kNext"; }
  if(!s){
    var openT = anyOpen.length + m.dayWin.filter(function(o){ return !o.met; }).length;
    if(openT) return '<div class="now calm"><div class="now-tx"><div class="now-k">'+esc(t("schedule"))+'</div><div class="now-n">'+esc(t("noneDue"))+'</div><div class="now-r">'+esc(t("openToday", {n:openT}))+'</div></div></div>';
    var nx = m.coming[0], sub = nx ? t("allDoneSub", {n:nx.it.name, w:(nx.d === 1 ? t("tomorrow") : fmt(parse(nx.it.next), {weekday:"long"})) + (nx.it.times[0] ? " " + ft(nx.it.times[0]) : "")}) : t("allDoneNone");
    return '<div class="now calm"><div class="now-tx"><div class="now-k">'+esc(t("schedule"))+'</div><div class="now-n">'+esc(t("allDone"))+'</div><div class="now-r">'+esc(sub)+'</div></div><button class="bigck" type="button" data-act="add" aria-label="Add">'+ico("plus", 26)+'</button></div>';
  }
  var act, attr = "", r;
  if(s.time){ act = "slot"; attr = ' data-time="'+s.time+'"'; r = rel(s); }
  else if(s.win){ act = "win"; r = describe(s.it) + " · " + s.win.count + "/" + s.it.quota; }

    (H && F.times.length ? '' : '<button type="button" class="tadd" id="tAdd">'+ico("plus", 18)+esc(t("addTime"))+'</button>');

}
$("sheet").addEventListener("click", function(e){

  if((b = e.target.closest("[data-mode]"))){ if(b.classList.contains("off")){ buzz([10, 40, 10]); if(!F.why){ F.why = true; paintSheet(); b = $("fKind").querySelector('[data-mode="flex"]'); } b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); return; } F.mode = b.getAttribute("data-mode"); paintSheet(); buzz(6); }

/* time: own scroll wheels, never the system picker */
var wheelBuilt = false;
function wheelLabels(){
  var h = '<div class="pad"></div>', i; for(i = 0; i < 24; i++) h += '<div data-v="'+i+'">'+(h12() ? ((i % 12) || 12)+'<i class="ap">'+ap(i)+'</i>' : ("0"+i).slice(-2))+'</div>'; $("wH").innerHTML = $("lH").innerHTML = h + '<div class="pad"></div>';
  $("presets").innerHTML = [["morning","08:00"],["noon","13:00"],["evening","20:00"],["night","23:00"]].map(function(p){ return '<button type="button" class="chip" data-pre="'+p[1]+'">'+esc(t(p[0]))+' <small class="tab">'+ft(p[1])+'</small></button>'; }).join("");
}
function buildWheels(){
  var h, i; wheelLabels();
  h = '<div class="pad"></div>'; for(i = 0; i < 60; i += 5) h += '<div data-v="'+i+'">'+("0"+i).slice(-2)+'</div>'; $("wM").innerHTML = $("lM").innerHTML = h + '<div class="pad"></div>';
  ["wH","wM","lH","lM"].forEach(function(id){
    var c = $(id), tm = null;
    c.addEventListener("scroll", function(){ clearTimeout(tm); tm = setTimeout(function(){ var k = Math.round(c.scrollTop / 40); if(c._k !== k){ c._k = k; buzz(3); } }, 60); }, {passive:true});
    c.addEventListener("click", function(e){ var d = e.target.closest("[data-v]"); if(d){ var k = [].indexOf.call(c.children, d) - 1; c.scrollTo({top:k*40, behavior:"smooth"}); } });
  });
  $("presets").addEventListener("click", function(e){ var b = e.target.closest("[data-pre]"); if(b) setWheels(mins(b.getAttribute("data-pre")), true); });
  wheelBuilt = true;
}
function setWheels(m, smooth, p){
  var bh = smooth ? "smooth" : "auto"; p = p || "w";
  $(p+"H").scrollTo({top:Math.floor(m/60)*40, behavior:bh});
  $(p+"M").scrollTo({top:Math.min(11, Math.round((m % 60)/5))*40, behavior:bh});
}
function readWheels(p){ var h = Math.min(23, Math.max(0, Math.round($(p+"H").scrollTop/40))), m = Math.min(55, Math.max(0, Math.round($(p+"M").scrollTop/40)*5)); return h*60 + m; }

/* ---------- later: choose when, see what's already there ---------- */
var LT = null;
function openLater(kind, id, time, cb){
  var it = find(id); if(!it) return;
  var info = kind === "slot" ? slotInfo(id, time) : null;
  hideToast(); LT = {kind:kind, id:id, time:time, cb:cb || function(o){ act(kind, id, time, null, o); }};
  $("lName").innerHTML = '<b>'+esc(it.name)+'</b>' + (info ? ' · ' + esc(ft(info.eff)) : '');
  var o = "";
  if(kind === "slot"){
    var nm = nowMin(), busy = model().slots.filter(function(s){ return !s.done && !s.missed && !(s.it.id === id && s.time === time); });
    var near = function(v){ for(var i = 0; i < busy.length; i++) if(Math.abs(busy[i].min - v) < 20) return busy[i].it.name; return null; };
    var r5 = function(v){ return Math.ceil(v/5)*5; };
    var free = r5(nm + 15); while(free <= 1435 && near(free)) free += 5;
    if(free <= 1435) o += '<button type="button" class="lopt best wide" data-to="'+hm(free)+'"><b>'+esc(t("nextFree"))+'</b><span>'+ft(free)+' · '+esc(t("inX", {x:dur(free - nm)}))+'</span></button>';
    [15, 30, 60, 120, 180, 240].forEach(function(x){
      var v = r5(nm + x), c = v <= 1435 ? near(v) : null;
      o += '<button type="button" class="lopt" data-to="'+hm(Math.min(v, 1435))+'"'+(v > 1435 ? ' disabled' : '')+'><b>'+esc(t("plusX", {x:dur(x)}))+'</b><span>'+(v > 1435 ? esc(t("midnight")) : ft(v))+'</span>'+(c ? '<em>'+esc(t("withX", {n:c}))+'</em>' : '')+'</button>';
    });
    o += '<button type="button" class="lopt wide" data-pick="1"><b>'+esc(t("pickTime"))+'</b><span>'+ico("clock", 16).replace("<svg", '<svg style="display:inline-block;vertical-align:-3px"')+'</span></button>';
  } else {
    [[1, t("tomorrow")], [2, t("inDays", {n:2})], [3, t("inDays", {n:3})], [7, t("nextWeek")]].forEach(function(d){
      o += '<button type="button" class="lopt'+(d[0] === 1 ? " best" : "")+'" data-days="'+d[0]+'"><b>'+esc(d[1])+'</b><span>'+esc(fmt(addDays(today(), d[0]), {weekday:"short", day:"numeric", month:"short"}))+'</span></button>';
    });
  }
  $("lOpts").innerHTML = o; $("lPicker").classList.remove("on"); $("lWarn").style.display = "none";
  $("lScrim").classList.add("on"); $("later").classList.add("on"); document.documentElement.classList.add("lock");
}
function closeLater(){ $("lScrim").classList.remove("on"); $("later").classList.remove("on"); if(!$("catch").classList.contains("on") && !$("sheet").classList.contains("on")) document.documentElement.classList.remove("lock"); LT = null; }
function pickLater(o){ var x = LT; closeLater(); if(x){ o.later = true; x.cb(o); } }
$("lOpts").addEventListener("click", function(e){
  var b = e.target.closest(".lopt"); if(!b || b.disabled) return;
  if(b.getAttribute("data-pick")){ if(!wheelBuilt) buildWheels(); $("lPicker").classList.add("on"); var v = Math.min(1435, Math.ceil((nowMin() + 60)/5)*5); requestAnimationFrame(function(){ setWheels(v, false, "l"); $("lPicker").scrollIntoView({block:"nearest", behavior:"smooth"}); }); return; }
  buzz(8);
  if(b.getAttribute("data-days")) pickLater({days:+b.getAttribute("data-days")}); else pickLater({to:b.getAttribute("data-to")});
});
$("lpCancel").addEventListener("click", function(){ $("lPicker").classList.remove("on"); });
$("lpSet").addEventListener("click", function(){
  var v = readWheels("l");
  if(v <= nowMin()){ $("lWarn").textContent = t("pastTime"); $("lWarn").style.display = ""; buzz([10, 40, 10]); return; }
  pickLater({to:hm(v)});
});
function allTag(it){
  if(it.paused) return '<span class="tag">'+esc(t("paused1"))+'</span>';
  var td = today();
  if(it.kind === "window"){ var pr = period(it.period, td), a = iso(pr[0]), b = iso(pr[1]), c = it.log.filter(function(d){ return d >= a && d <= b; }).length; return '<span class="tag tab'+(c >= it.quota ? " tnow" : "")+'">'+c+'/'+it.quota+'</span>'; }
  var nx = parse(it.next), d = diff(td, nx), tm = it.times.length ? " · " + ft(it.times[0]) + (it.times.length > 1 ? " +" + (it.times.length - 1) : "") : "";
  if(d < 0 && !it.times.length) return '<span class="tag late">'+esc(t("lateD", {n:-d}))+'</span>';
  var lbl = d <= 0 ? t("dueToday") : d === 1 ? t("tomorrow") : fmt(nx, d < 7 ? {weekday:"short"} : {day:"numeric", month:"short"});
  return '<span class="tag tab">'+esc(lbl + tm)+'</span>';
}
function allSort(a, b){ var ka = a.kind === "window" ? "9" : a.next + (a.times[0] || "99"), kb = b.kind === "window" ? "9" : b.next + (b.times[0] || "99"); return ka < kb ? -1 : ka > kb ? 1 : a.name.localeCompare(b.name); }
function paintAll(){
  var act = items.filter(function(i){ return !i.paused; }).sort(allSort), pz = items.filter(function(i){ return i.paused; }).sort(allSort);
  function list(arr){ return arr.map(function(it){ return '<button type="button" class="row'+(it.paused ? " paused" : "")+'" data-aid="'+it.id+'" style="width:100%"><span class="bd"><span class="nm" style="display:block">'+esc(it.name)+'</span><span class="sb" style="display:block">'+esc(describe(it))+'</span></span>'+allTag(it)+'</button>'; }).join(""); }
  var h = "";
  if(!items.length) h = '<p class="hint">'+esc(t("noneYet"))+'</p>';
  if(act.length) h += '<div class="mini">'+esc(t("activeT"))+' · '+act.length+'</div><div class="box">'+list(act)+'</div>';
  if(pz.length) h += '<div class="mini">'+esc(t("pausedT"))+' · '+pz.length+'</div><div class="box">'+list(pz)+'</div>';
  $("aList").innerHTML = h;
}
function openAll(){ closeMenus(); hideToast(); paintAll(); $("aList").scrollTop = 0; $("aScrim").classList.add("on"); $("all").classList.add("on"); document.documentElement.classList.add("lock"); }
function closeAll(){ $("aScrim").classList.remove("on"); $("all").classList.remove("on"); document.documentElement.classList.remove("lock"); }
$("aList").addEventListener("click", function(e){ var b = e.target.closest("[data-aid]"); if(!b) return; var it = find(b.getAttribute("data-aid")); closeAll(); if(it) setTimeout(function(){ openSheet(it); }, 120); });
$("aScrim").addEventListener("click", closeAll); $("aClose").addEventListener("click", closeAll);
$("aAdd").addEventListener("click", function(){ closeAll(); setTimeout(function(){ openSheet(null); }, 120); });
$("allBtn").addEventListener("click", openAll);
$("lScrim").addEventListener("click", closeLater); $("lClose").addEventListener("click", closeLater);
function openPicker(){
  if(!wheelBuilt) buildWheels();
  $("picker").classList.add("on");
  var v = F.unit === "h" && F.times.length ? mins(F.times[0]) : F.times.length ? mins(F.times[F.times.length-1]) + 60 : Math.ceil((nowMin() + 1)/60)*60;
  if(v >= 1440) v = 1380;

/* save / skip / delete (two taps — no system confirm box) */
$("saveBtn").addEventListener("click", function(){
  var name = $("fName").value.trim();
  if(!name){ $("fName").focus(); $("fName").placeholder = t("needName"); buzz([10,50,10]); return; }
  var before = snap(), it = editing ? JSON.parse(JSON.stringify(editing)) : {id:uid(), last:null, log:[]};
  var flex = F.mode === "flex", kind = flex ? "window" : "fixed", times = flex ? [] : F.times.slice().sort(), n = flex ? 1 : N();
  if(!flex && F.unit === "h" && !times.length) times = [stamp()];
  var a0 = editing && (parse(editing.anchor) || parse(editing.next));
  var changed = !editing || editing.kind !== kind || editing.n !== n || editing.unit !== F.unit || editing.period !== (flex ? F.unit : editing.period)
    || (F.unit === "w" && a0 && (a0.getDay()+6)%7 !== F.wd) || (F.unit === "m" && a0 && a0.getDate() !== F.md) || (F.unit === "h" && editing.times[0] !== times[0]);
  it.name = name; it.kind = kind; it.n = n; it.unit = flex ? "d" : F.unit; it.quota = F.quota; it.period = flex ? F.unit : "w"; it.times = times; it.shift = !flex && F.shift;
  if(changed){ var sd = iso(startDate()); it.next = sd; it.anchor = sd; it.at0 = times[0] || null; it.prev = null; it.slots = null; }
  var wasPaused = !!(editing && editing.paused); it.paused = !!F.paused;
  if(wasPaused && !it.paused && !changed && kind !== "window"){   /* resume from today, not from the past */
    var td0 = today(), ni = norm(it);
    if(it.unit === "h") it.next = iso(td0);
    else if(parse(it.next) < td0) it.next = iso(ni.kind === "fixed" && !ni.shift ? firstOnOrAfter(ni, td0) : td0);
    it.slots = null; it.prev = null;
  }
  var n = norm(it);
  if(editing) items[items.indexOf(editing)] = n; else items.push(n);
  save(); closeSheet(); lastHTML = ""; render(); buzz(10);
  if(!editing) toast(t("added", {n:name}), before);
  else if(wasPaused !== it.paused) toast(t(it.paused ? "pausedMsg" : "resumed", {n:name}), before);
});
$("skipBtn").addEventListener("click", function(){
  if(!editing) return; var before = snap(), it = editing;
  skipItem(it);
  save(); closeSheet(); lastHTML = ""; render();
  toast(t("skipped", {d:fmt(parse(it.next), {weekday:"short", day:"numeric", month:"short"})}), before);
});
var armT = null;
function disarm(){ clearTimeout(armT); $("delBtn").classList.remove("armed"); $("delTx").textContent = ""; }
$("delBtn").addEventListener("click", function(){
  if(!editing) return;
  if(!this.classList.contains("armed")){ this.classList.add("armed"); $("delTx").textContent = t("del2"); buzz(20); armT = setTimeout(disarm, 3000); return; }
  var before = snap(), id = editing.id;
  items = items.filter(function(i){ return i.id !== id; });
  save(); closeSheet(); lastHTML = ""; render(); toast(t("removed"), before);
});

/* swipe the sheet down to close */
(function(){
  var y0 = null, dy = 0, sh = $("sheet");
  function start(e){ if(window.innerWidth >= 700) return; y0 = e.touches[0].clientY; dy = 0; sh.classList.add("drag"); }
  function move(e){ if(y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = "translateY(" + dy + "px)"; if(e.cancelable) e.preventDefault(); }
  function end(){ if(y0 === null) return; sh.classList.remove("drag"); y0 = null; if(dy > 90) closeSheet(); else sh.style.transform = ""; }
  [$("grab"), $("shHead")].forEach(function(el){ el.addEventListener("touchstart", start, {passive:true}); el.addEventListener("touchmove", move, {passive:false}); el.addEventListener("touchend", end); el.addEventListener("touchcancel", end); });
})();

/* ---------- menus ---------- */

document.querySelectorAll("[data-i]").forEach(function(n){ n.innerHTML = ico(n.getAttribute("data-i"), n.closest(".mi") ? 19 : 20); n.style.display = "contents"; });

/* ---------- import / export ---------- */

  var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "routines-" + iso(today()) + ".json";

}
})();
